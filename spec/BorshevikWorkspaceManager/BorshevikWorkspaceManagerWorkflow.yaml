description: "How work is done on the Borshevik Workspace Manager, one of Borshevik's own GNOME Shell extensions, in a repository of its own. As on Borshevik itself (@BorshevikWorkflow#branches), the maintainer works on `experimental` and brings what is tried to `main` by pull request; there are no pipelines of the extension's own. A change is tried before it is committed, twice: by the agent in a test machine running the current Borshevik image with the working tree in place of the image's copy (try_in_vm), then on the author's machine, where the extension is installed per user as a link into the repository's working tree, so a fresh GNOME Shell session runs exactly what is on disk. Only then is it committed and pushed — to `experimental`, which no build reads. The fact that shapes the rest is that a push to `main` is a delivery: @GnomeExtensions clones this repository's `main` (list.json names the branch) at every final-layer build of @BorshevikImage and @BorshevikNvidiaImage, so whatever `main` carries at that moment goes into the next Borshevik `:latest`, with no tag or release in between. Testing therefore happens before the change reaches `main`, not after it — Borshevik's own `experimental` builds read the extension's `main` too, so there is no way to try a change inside a built image without having already delivered it. That is why the work lives on `experimental` until the author decides it ships, and why a pull request into `main`, not a push, is the moment of delivery. From `:latest` on, the change travels with Borshevik and reaches users the way @BorshevikWorkflow moves any change. There are no versions and no release notes: the extension is not published on extensions.gnome.org, and nothing reads metadata.json's `version`."
extends: "@DuckWorkflow"
main_branch: main
guidelines:
  - Never merge into `main` to find out whether something works. `main` is read by every Borshevik build, `experimental` ones included, so the moment a change reaches it is the moment it reaches `:latest` and everyone following it; the only places to try a change without delivering it are a test machine and a local session. Pushing to the extension's `experimental` delivers nothing, and is how work is kept safe off one machine.
  - "Borshevik installs the extension by copying its directory as it stands on `main` and compiling its GSettings schemas when list.json names them — nothing else is built. Whatever else has to be compiled, translations above all, is shipped as committed: a change to its source is not finished until the compiled file is regenerated and committed alongside it."
  - "`shell-version` in metadata.json must name the GNOME version the current Borshevik image ships. list.json does not set `forceGnomeVersion` for Borshevik's own extensions, so when Borshevik moves to a new GNOME release an extension silently stops loading in the image until its metadata is updated and pushed — check this whenever Borshevik's base changes GNOME version, not only when the extension itself changes."
  - "The compiled Russian translation under `locale/` is what the image ships, since Borshevik builds nothing but the schemas: a change to `po/ru.po` is not finished until the `.mo` is regenerated with msgfmt and committed alongside it, or the image keeps the old strings."
  - "`schemas/gschemas.compiled` is the opposite case — ignored by git and compiled at install time, both by the image build and by @BorshevikWorkspaceManagerExtension#recipes#run — so it is never committed."
branches:
  - id: main
    description: "What ships. Borshevik's final-layer build clones it at whatever commit it holds when the build runs — including builds of Borshevik's own `experimental` — so nothing reaches it that has not already been tried in a test machine and a local session. Changes arrive by pull request from `experimental` once tried, and nothing is committed here that is not on `experimental` first — save a fix that cannot wait while `experimental` carries work not yet trusted: that goes on a short-lived branch from `main`, by pull request, and `experimental` takes it from `main` afterwards."
  - id: experimental
    description: Where the work is committed and pushed, tried in the test machine and in the author's sessions from the working tree; no Borshevik build reads it, so a push here ships nothing. Now it carries the rewrite around the planner (2026-10-18), which goes to `main` in one pull request once the author trusts it.
channels:
  - id: borshevik-image
    from: main
    description: "The only way the extension reaches anyone: installed system-wide into Borshevik images at build time. Not a channel the extension controls — it is Borshevik's `:latest` (testers; every build lands there) and then `:stable` (users; moved there by hand), as @BorshevikWorkflow declares them. The extension only feeds it, by what `main` carries when a Borshevik build runs."
steps:
  - id: requested
    description: A change is wanted — a bug seen in daily use, or a request in the conversation. It is clarified, then written into the terms.
    when: a request exists that the project's terms do not yet reflect
  - id: specified
    description: The change is in the spec, which is consistent, but the sources do not implement it yet.
    when: the change is present in the terms, verify_project is clean, and the sources do not yet implement it
    operation: "@Software#build"
  - id: implemented
    description: "The working tree carries the change and the spec validates, but nobody has seen it run. Before the author spends a login on it, the agent tries it in a test machine (try_in_vm), which shows whether the change does what was asked and catches what breaks — an extension that fails to load, errors in the journal — without the author. A test machine has no real GPU and not the author's own setup, so it does not replace the author's try; it makes sure that what the author tries already works. A failure sends the change back to `requested`."
    when: the working tree carries the change, @DuckspecProject#validate passes, and the change has not been tried in a test machine since it was last edited
    operation: "@BorshevikWorkspaceManagerWorkflow#try_in_vm"
  - id: tried_in_vm
    description: The change worked in a test machine as intended, but no session of the author's has run it yet — the session in use loaded the extension before the change was made. The extension's own run recipe links the working tree in and asks the author to log in again.
    when: the change was tried in a test machine since it was last edited and worked there, and the author's running gnome-shell process started before the change was last edited
    operation: "@Software#run"
  - id: testing_locally
    description: "A fresh session runs the change from the working tree, and the author uses it to see that it works — the behaviour that was asked for, and nothing around it broken. Only the author can say it does; nothing here checks it. Errors the extension throws land in the user journal, which is worth reading before calling it done."
    when: the running gnome-shell process started after the change was last edited, and the author has not yet confirmed it works
    operation: "@Git#commit"
  - id: committed
    description: The change is recorded locally and has reached no one. Pushing it to `experimental` keeps it safe off this machine and delivers nothing.
    when: local commits carry the change and are not on the remote
    operation: "@Git#push(branch=experimental)"
  - id: on_experimental
    description: "The change is on `experimental`, reaches no build, and goes on being used from the working tree and tried in the test machine, more changes joining it there. It goes to `main` when the author says it should ship — a decision of theirs, not a check: everything that checks a change has already run on it before it was committed. The pull request's description says what the branch brings and how it was tried."
    when: experimental carries the change, main does not, and no pull request into main carries it
    operation: "@GitHub#open_pull_request(head=experimental, base=main)"
  - id: in_review
    description: "A pull request from `experimental` to `main` carries the change. Merging it delivers it: the next Borshevik build clones `main`."
    when: an open pull request into main carries the change
    operation: "@GitHub#merge_pull_request(strategy=merge)"
  - id: on_main
    description: "The change is on main and waits for a Borshevik build to pick it up. Nothing in the extension's repository starts one: Borshevik's daily schedule does, or a build started by hand in the Borshevik repository — from its `main` (@BorshevikWorkflow#steps#on_main) or its `experimental`, both of which clone the extension's `main`. Only the final layer needs rebuilding (@BorshevikWorkflow#build-borshevik)."
    when: main carries the change and no Borshevik image on `:latest` was built after it was pushed
  - id: on_latest
    description: "A Borshevik image carrying the change is on `:latest`, where testers get it. It reaches users when that build, or a later one, is promoted to `:stable` — the step @BorshevikWorkflow#steps#built_from_main, performed in the Borshevik repository, not here."
    when: a Borshevik image on `:latest` was built after the change was pushed, and `:stable` resolves to an image built before it
  - id: on_stable
    description: The change reaches users through Borshevik's `:stable`.
    when: "`:stable` resolves to a Borshevik image built after the change was pushed"
components:
  - id: test-vm
    type: "@ShellScript"
    src:
      - tests/vm.sh
      - tests/vm/unsafe-mode@borshevik-test/extension.js
      - tests/vm/unsafe-mode@borshevik-test/metadata.json
      - tests/scenarios.js
      - tests/vm/run.js
      - tests/vm/test-window.js
    description: "The test machine try_in_vm uses, and everything needed to work it, in this repository: a clone of it alone is enough to try a change. It also runs the extension's scenarios against a real GNOME Shell (`scenarios`): tests/scenarios.js holds them as data, one entry per scenario of @BorshevikWorkspaceManagerExtension#behaviour, keyed by its path; tests/vm/run.js acts each one out in the machine; tests/vm/test-window.js is the window it opens for them. One kept machine, not a throwaway one per try — it keeps what was installed in it, Android above all, which takes long to install — in ${XDG_CACHE_HOME:-~/.cache}/borshevik-extensions-vm: its disk, made once from a bootc image with GNOME, standing on its own; its UEFI variables; its SSH key; and while it runs, its QMP and SPICE sockets and the local port forwarded to its SSH. The machine is shared by all of Borshevik's own extensions — each repository keeps its own copy of this script, which works it the same way (the same directory, user `tester` and unsafe-mode helper) and adds the commands its own extension needs. Two consequences follow. One try at a time: `start` refuses while the machine runs, which is how a try from another repository shows itself. And a working-tree copy another repository deployed stays in tester's extensions, overriding the image's copy of that extension, so a try sees that copy, not the image's. The image is Borshevik's `:latest` by default, the system the extension ships in, and the only one with Android (@WaydroidApp); any other bootc image with GNOME can be given instead. Runs on the host, not in a sandbox; needs ssh, skopeo, python3, podman through run0 (for `setup` only) and the GNOME Boxes flatpak, whose qemu and UEFI firmware run the machine — KVM, q35, host CPU, 4 cores, 6 GiB, virtio disk and GPU, no window. tests/vm/unsafe-mode@borshevik-test is a test-only extension installed for tester whose enable() sets `global.context.unsafe_mode = true`, so org.gnome.Shell.Eval answers and the shell's state — windows, workspaces, the extension's win._bwm* fields — can be read."
    functions:
      - id: setup
        description: "`vm.sh setup [image]` — makes the machine's disk from <image> with bootc-image-builder, run through podman as root (run0 asks for the password once), with root's SSH key and a 40 GiB root; refuses if the machine exists, to be made again only after its directory is deleted."
      - id: start
        description: "`vm.sh start [image]` — boots the machine in a session of its own, so it outlives the command, and waits for SSH and the end of boot. Brings it to <image>'s current build when the booted digest differs, and reboots into it: an upgrade when it already follows <image>, since rpm-ostree refuses to rebase onto the reference it boots, and otherwise a rebase — signed for Borshevik's images, whose policy knows their key, unverified for others. Prepares the user `tester`, logged in by GDM itself: created if missing, its screen never blanking or locking, Borshevik's App Manager first run marked done so it does not open over the desktop, and the unsafe-mode helper installed and enabled. Then leaves the overview the session starts in."
      - id: deploy
        description: "`vm.sh deploy` — installs the working tree's borshevik-workspace-manager@komorebinator/ for tester in place of the image's copy — a user's copy overrides the system one — compiles its schemas there, enables it — switching user extensions back on too, since on a shared machine an earlier try may have switched them all off — turns on its debug-logging, and restarts tester's session (GDM stopped, tester logged out, settings written, GDM started), since GNOME Shell on Wayland cannot reload an extension. Then leaves the overview."
      - id: android
        description: "`vm.sh android` — installs Android with Borshevik's `borshevik-waydroid install`, or, when it is installed already, brings it up to date with `borshevik-waydroid upgrade`, then starts a session as tester and waits for `sys.boot_completed`. Stops with a message on an image without Borshevik's tool."
      - id: ssh
        description: "`vm.sh ssh [command]` — a root shell in the machine, or a command run there as root."
      - id: droid
        description: "`vm.sh droid <command>` — runs a command as root inside Android through `lxc-attach` into the container (`am`, `cmd`, `dumpsys`, `settings`), waking it first: a frozen Android (Container: FROZEN) answers nothing until the container service's Unfreeze."
      - id: eval
        description: "`vm.sh eval <js|file>` — evaluates JavaScript in tester's GNOME Shell through org.gnome.Shell.Eval and prints the result; exits 1 when the evaluation failed."
      - id: state
        description: "`vm.sh state` — the active workspace, the number of workspaces, whether the overview is shown, and each normal window with its workspace and what the extension made of it (full-screen Android, ignored, its _bwmState)."
      - id: key
        description: "`vm.sh key <keys>...` — sends keys through QMP `send-key`, each as QEMU qcodes joined by `+` (`super` standing for meta_l), a second and a half apart; stops at one QMP refuses."
      - id: open
        description: "`vm.sh open <name> [width height] [--min-width px] [--maximized] [--fullscreen]` — opens a test window as tester (tests/vm/test-window.js under gjs, copied into the machine on first use): titled <name>, with the app id org.borshevik.Test.<name> so rules and wm_class can tell test windows apart, at the given size in pixels. A window of its own per process, so closing one never takes another with it."
      - id: drag
        description: "`vm.sh drag <x1> <y1> <x2> <y2>` — presses the left button at one point of the screen, moves the pointer to the other in steps and releases it there, through QMP input-send-event on the machine's USB tablet, so Mutter sees a real grab: a drag by a title bar, with its threshold and snap zones, can be tried only this way, since moving a window from Eval starts no grab at all. Coordinates are the screen's pixels."
      - id: point
        description: "`vm.sh point <x> <y>` — moves the pointer to that point of the screen without pressing a button, through QMP on the machine's USB tablet: where it rests is what decides the focus once a workspace is shown when GNOME's focus follows the mouse (behaviour#view-follows-user#focus-goes-along)."
      - id: scenarios
        description: "`vm.sh scenarios [filter]` — runs tests/vm/run.js with the host's gjs, which acts out every scenario of tests/scenarios.js whose path contains <filter> in tester's session and prints ok, FAIL or SKIP for each, with what was expected and what was found on a failure, and a screenshot of it in the machine's directory. Each scenario starts from a clean desktop: the test windows of the one before closed, one workspace left, the remembered float sizes cleared, the window rules back to their defaults, and GNOME's focus mode back to focus following the mouse — Borshevik's default and the author's own, under which which window GNOME focuses after a workspace switch depends on where the pointer rests — the two settings that move the view by themselves — overview-on-last-workspace and on-empty-workspace — off, unless the scenario is about them; a scenario that depends on the focus mode names it (`given.focusMode`) and, under focus following the mouse, places the pointer with `point`: opening the overview in the middle of building a layout would hide every new window's first frame from the extension. Its `given` is built the way a user would build it — windows opened with `open`, tiled with Super+Left/Right, maximized — and its `when` is done the same way: keys through QMP, drags with `drag`, the rest through Eval calls on the window, which the extension cannot tell from the user's own. Its `then` is checked against what can be seen — which workspace each window is on, whether it fills a half, the whole work area or neither, whether it is minimized, which workspace is shown, which window has the focus — never against the extension's internal state, so the same scenarios judge the old code and the new alike. A step waits for the shell to settle, its windows and workspaces unchanged over several polls, before the next one; a scenario that needs what a test window cannot be — a real app's behaviour, Android, a hand resize — is marked so and skipped. Which scenarios run is chosen as in Borshevik's own test machine (@BorshevikWorkflow#scenarios): a scenario with no group always runs — they are cheap and judge the core — while one in a group runs only when a change touches that group's `paths`, git pathspec globs declared once with the groups in tests/scenarios.js, the single statement of which files make it needed. `--select auto`, the default, takes the files changed against origin/main together with those changed in the working tree and not yet committed; `all` runs every group, `none` none; the run prints which groups it chose and why. Groups exist for what a test window cannot stand in for: `chrome`, Google Chrome itself — its asynchronous geometry, a session restore, a tab dragged out — and `android`, Waydroid's windows, slow because Android has to be up and every recreation of a window takes seconds. A scenario of a group is a variant of a scenario of @BorshevikWorkspaceManagerExtension#behaviour acted out with that app, printed with the group after its path. Exits 1 when any scenario failed."
      - id: shot
        description: "`vm.sh shot [file]` — a screenshot through QMP `screendump`, written as PNG, by default screen.png in the machine's directory; prints where."
      - id: stop
        description: "`vm.sh stop` — powers the machine off from inside, so its disk is left consistent, falling back to QMP quit if it has not stopped within two minutes."
recipes:
  - id: try_in_vm
    description: Tries the working tree in the test machine (test-vm) by running its scenarios against the real shell — those of the groups the change touches as well, Chrome's and Android's among them; what is left to a person is what no machine can show, and that is the author's own try.
    instructions:
      - "If ${XDG_CACHE_HOME:-~/.cache}/borshevik-extensions-vm has no disk.qcow2, make the machine with `tests/vm.sh setup` — it asks the author for their password once and takes a while, so say so first. Then `tests/vm.sh start`, which brings it to the current Borshevik `:latest` and logs tester in. If it refuses because the machine is running, a try from another extension's repository may be in progress: ask the author before using it, and never stop it from here."
      - "`tests/vm.sh deploy` to run the working tree. Android is brought up by the scenarios themselves when the android group is chosen."
      - "`tests/vm.sh scenarios` and read every FAIL with its screenshot and the extension's `[BWM]` lines from that moment: a failing scenario is a defect, in the extension or in the scenario, and which of the two is settled before going on. The SKIPs are what is left for the hand."
      - "Only for what the scenarios do not reach, look by hand: `vm.sh state` and `vm.sh eval` for windows' workspaces and the extension's state, the extension's `[BWM]` lines in tester's journal (`vm.sh ssh journalctl -b _UID=<tester's uid>`), `vm.sh shot` for what the screen shows, `vm.sh droid` for Android (`am`, `cmd`, `dumpsys`). The overview stops the extension from seeing new windows draw — GNOME opens it on its own when the active workspace is left empty — and `vm.sh key esc` closes it. A case that keeps coming back to the hand is a scenario not yet written: write it."
      - "Stop the machine when the trying is done, `tests/vm.sh stop`; it is not left running between tries."
      - "Report each case and what was seen, with a screenshot where it helps. All as intended moves the change to `tried_in_vm`; anything else is a defect to fix first."
