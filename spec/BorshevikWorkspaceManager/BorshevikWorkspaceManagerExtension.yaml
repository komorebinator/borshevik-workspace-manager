guidelines:
  - "All placement goes through the planner. An adapter (windows, drag, android, the keybindings) turns what happened into an intent; dispatch takes a snapshot of the wall, asks planner#plan for a plan, and hands it to executor#run. No adapter moves, tiles, maximizes or activates anything itself, and the planner calls nothing in Mutter. The old code had each signal handler decide and act on its own: two handlers could undo each other, nothing decided which workspace to show — `activate()` was called from nine places — and guard flags cleared at the next idle had to keep its own signals from being taken for the user's. Covered guests going unmoved, workspaces flipping back and forth by themselves and windows ending up far from where they were all appeared under that structure, and one place that decides is what lets every rule in `behaviour` hold at once."
  - Intents are handled one at a time and in order, each plan carried out to its end before the next intent is planned (dispatch, executor#run). Workspaces created and windows moved at the same time corrupt workspace indices — the old code needed a queue of moves for exactly that — and a plan made from a snapshot taken while another plan is half done decides on a wall that does not exist.
  - A change the extension caused is recognised by comparison, not by flags. Before executor touches a window it writes the outcome into the window's record — its role, the workspace it will be on (`role` and `lastWs` in registry#record) — so a signal that leaves the window as its record says it is, is an echo and is dropped, and only one that differs becomes an intent (windows#_onWorkspaceChanged, windows#_onMaximizeChange). The two maximized-* notifies of one operation are told apart by the combined state last acted on, kept per window (windows#this._seen). Flags set before an action and cleared at the next idle are what the old code used, and a signal arriving after that idle, or a second action starting before it, defeated them. The one exception is window-removed, emitted from inside change_workspace itself, which executor#isMoving answers for the duration of that call only.
  - "The planner decides from the model, never from Mutter's state in mid-transition: a window's role is the one in its registry record. Mutter's maximize and fullscreen flags are read only where the record does not mean anything yet — a window being taken under management (windows#register, windows#adoptExisting) — and where an adapter tells an echo from a change the user made (windows#_onMaximizeChange). The per-axis maximized_horizontally/maximized_vertically disagree with each other and with the window throughout the asynchronous gaps this code spends most of its time in; Meta.Window has no get_maximized() on GNOME 49/50, so no code calls it."
  - "Never move a window to another workspace, or activate a workspace, inside a handler Mutter calls while it paints a frame — a window actor's `first-frame`, a `BEFORE_REDRAW` later — but at the next idle. Mutter asserts that no frame is in progress when the top window actor changes, and on failing the assertion aborts GNOME Shell: moving an Android window from its first-frame handler took the author's session down on 2026-10-06 (`invalidate_top_window_actor_for_views: assertion failed: (!priv->frame_in_progress)`). dispatch therefore plans and executes only at idle, whatever queued the intent; registering a window from first-frame is safe, since it only records it and queues its opened intent, which dispatch plans at the next idle."
  - An exception thrown inside an idle callback or a signal handler is lost together with whatever it interrupted. dispatch and executor#run catch it, LOG it and carry on with the next operation and the next intent, so that one failure cannot strand a half-moved window and every intent queued behind it; the old code wrapped its slot return in a try for the same reason.
  - "Every signal handler, every intent dispatched, every plan and every operation executed calls LOG near its entry and at each key transition, with a prefix naming the module and action and the context that matters (the window as log#name names it, its role, workspace index, the intent or op) — e.g. LOG('executor: move', name(win), '→ ws', ws.index()). The debug log is how a misbehaviour seen on someone's machine is reconstructed afterwards, and it is only worth anything if it is everywhere; this is not spelled out on each @Function, and a rebuild keeps it across every module, not only where a description happens to mention it."
  - "The extension runs all the time, in GNOME Shell's main thread, where whatever it does is paid for on every frame; what it costs is measured, not guessed (perf). Every signal handler of its own is connected through perf#handler and every later and timer runs inside perf#measure, named `<module>: <signal or what it does>`, and whatever the extension holds per window or per workspace is named to perf#watchSize — so the report misses nothing, and a handler or a list added without it is a gap in it. The report only collects; what is too often or too slow is judged by reading it and by the tests of behaviour#quiet, never by thresholds in the extension. It is read the same way in the test machine (tests/vm.sh perf) and in the author's live session (the D-Bus call in extension, or Copy in preferences)."
  - The extension's state lives in the registry — a map from Meta.Window to its record, owned by the extension and cleared on disable — and in the maps of the modules that need their own (android); nothing is attached to Meta.Window objects. The extension stays enabled while the screen is locked (metadata's session-modes), so its state needs to last only as long as it is on; until session-modes was set it was disabled on every lock, which is why the old code kept its state on the windows themselves. Windows already open when it is enabled are taken under management where they are (windows#adoptExisting).
  - No timer, delay or deadline is added to the extension without the author's explicit agreement, asked for that timer on its own. A timer stands in for something the extension does not know — that a window is ready, has taken its size, will be replaced — and guesses it from time; every bug found at the edges with apps and Mutter was one such guess failing, and every fix that added a condition to a timer made the next one harder to find (2026-10-19, when all but Android's (android#ANDROID_REPLACE_MS) were replaced by what Mutter can say — a window's first frame or first size, the minimum width its app declares, its next size-changed, the pointer's every move during a drag (drag#_follow), once polled every 33 ms — and windows opening together, once gathered for 150 ms, came to be placed each on its own). First look for the event or the state that says it; propose a timer only when there is none, saying what it guesses and why nothing else can tell. Deferring to the next idle (LaterType.IDLE), an animation's duration and polling a value with no signal are not guesses of this kind, but the last still needs the same agreement.
recipes:
  - id: run
    description: Makes the next GNOME Shell session on this machine run the extension straight from the working tree, so a change can be tried before it is committed. The extension is installed per user as a symlink into the repository; a copy under the same UUID in ~/.local/share takes precedence over the one the Borshevik image installs in /usr/share/gnome-shell/extensions, so the session runs the working tree, not the image's copy of the branch Borshevik ships.
    instructions:
      - "Check ~/.local/share/gnome-shell/extensions/borshevik-workspace-manager@komorebinator. If it is missing, create it as a symlink to this repository's borshevik-workspace-manager@komorebinator/ directory. If it is a real directory, or a symlink pointing anywhere else, stop and ask — it is an installation someone made on purpose."
      - "Compile the schemas in place with `glib-compile-schemas borshevik-workspace-manager@komorebinator/schemas`; the output is ignored by git, and the image compiles its own at build time."
      - "If po/ru.po is newer than the compiled .mo under locale/ru/LC_MESSAGES, regenerate it with `msgfmt -o <that .mo> po/ru.po`. Unlike the schemas, the .mo is committed and is what the image ships, so it becomes part of the change."
      - "Check `gnome-extensions info borshevik-workspace-manager@komorebinator` and enable it with `gnome-extensions enable` if it is not enabled."
      - "GNOME Shell on Wayland cannot reload an extension or restart in place: ask the author to log out and back in. Never do it for them — it ends every program in the session, this one included."
      - "Once they are back, look for errors the extension threw since login in `journalctl -b /usr/bin/gnome-shell`, and report them before the author starts testing."
behaviour:
  - id: role-by-size
    description: "A new window gets the role its size suggests, once, when it opens: one that already fills nearly the whole work area is made full, one that looks like a tile is tiled, anything else floats. A window that opens nearly full screen is meant to be looked at alone, and one the height of the screen and about half its width was sized to sit beside another; leaving either floating would make the user do by hand what the window already says. The decision is taken at opening and never again — not when the extension moves the window to another workspace, not when its size changes later — because a window judged a second time can change its mind and move again, and every move it makes is one the user did not ask for."
    scenarios:
      - id: opens-nearly-full
        given: A window is about to open on the primary monitor
        when: It opens covering more than 90% of the work area both ways
        then: It is maximized, and from then on is a full window (see behaviour#full-alone)
      - id: opens-tile-shaped
        given: A workspace with at least one free slot
        when: A window opens as tall as the work area and between 20% and 80% of its width
        then: It is tiled on the half its centre is on if that slot is free, else in the other one; alone on the workspace it keeps its width, up to 80%, and beside a tile it fills what that tile leaves
      - id: opens-other
        given: Any workspace
        when: A window opens at any other size
        then: It floats where it opened, at the size it opened at; the size remembered for its app (behaviour#two-slots#float-size-remembered) is used only when it floats again after being tiled
      - id: not-judged-again
        given: A tile-shaped window that the extension has just moved to another workspace
        when: It arrives there
        then: Its role stays the one it had; its size is not judged again, so it does not become full or move a second time
      - id: session-restore
        given: An app restoring a session, Chrome for one, opens several windows within a fraction of a second, some of them maximized
        when: They appear
        then: "Each is placed on its own as soon as it is ready, on the wall the ones before it left: each maximized one gets a workspace of its own, and the others are placed by their size, without pushing one another out"
      - id: slow-to-open
        given: An app slow to start — Chrome restoring its session at login — opens a window that has neither drawn a frame nor got a size half a second later
        when: It gets its size, tile-shaped
        then: It is judged once it has a size — at its first frame, or, on a workspace not shown, which draws no frame, at its first size — by that size, and tiled like any tile-shaped window; it is not judged at its 0×0 and left floating. Seen at the author's login on 2026-10-19
  - id: full-alone
    description: "A full window — maximized or fullscreen — has its workspace to itself. When a window becomes full on a workspace of the primary monitor that holds any other managed window, guests included, it moves to a workspace of its own on the right — the right-hand neighbour if that is empty, else a new one between them — the view goes with it, and the workspace it left is its home (behaviour#going-home). The user made it full to look at it alone, and the windows it would otherwise lie on top of would be hidden from the wall. A full window the user moves themselves onto a workspace with other windows is the one exception: it stops being full there instead of being sent away (behaviour#user-moves)."
    scenarios:
      - id: maximize-shared
        given: Workspace S holds window W and other windows
        when: The user maximizes W
        then: W moves, maximized, to an empty workspace right of S — the neighbour if it is empty, else a new one — and that workspace is shown; the other windows stay on S as they were
      - id: maximize-alone
        given: Window W is alone on workspace S
        when: The user maximizes W
        then: W stays on S, which becomes a full workspace
      - id: drop-at-top
        given: Workspace S holds window W and other windows
        when: The user drags W to the top edge and drops it there
        then: "The same as maximize-shared: W is maximized on a workspace of its own on the right, which is shown"
      - id: tile-goes-fullscreen
        given: Window W is tiled on S beside another tile
        when: W goes fullscreen — F11, or a video it plays
        then: W moves to a workspace of its own on the right, which is shown; when it leaves fullscreen it goes back to its slot (behaviour#going-home#unmaximize-to-free-slot)
      - id: opens-maximized-shared
        given: The active workspace S holds other windows
        when: A window opens maximized, or nearly full screen (behaviour#role-by-size#opens-nearly-full)
        then: It gets a workspace of its own on the right, which is shown, with S as its home
  - id: two-slots
    description: "A tile workspace has two slots, left and right, and a tile already in place keeps its width: a window tiled beside it takes what is left of the work area rather than resizing it, because the user sized it that way. The one exception is a window that cannot be made that narrow — many have a smallest width — and then the tile in place gives up just as much as the newcomer needs, never more: the two are not reset to halves. What happens when a window is tiled into a slot that is taken depends on whether the user chose that slot. An explicit tile — Super+Left/Right, or a drop at an edge — gets it, and the window there makes room (behaviour#displacement). A window the extension tiled by its size (behaviour#role-by-size) does not: nothing says which of the two tiles it should replace, or that it should replace either, so it goes to the right with the user instead, where dragging it brings it back to choose (behaviour#going-home#drag-carries-home)."
    scenarios:
      - id: free-slot
        given: Workspace S has tile A in its left slot, at a width the user set, and its right slot free
        when: Window W is tiled to the right — by key, by a drop, or by its size
        then: W takes the right slot at the width A leaves; A is not resized
      - id: narrow-remainder
        given: Tile A has been widened until what is left beside it is narrower than the smallest width window W can take
        when: Window W is tiled into the other slot
        then: W takes the other slot at its smallest width, and A is narrowed by exactly as much as W needed beyond what was left, so the two fill the work area without overlapping; A keeps the rest of the width the user gave it
      - id: resize-slow-pair
        given: Workspace S has tiles A and B, apps slow to take a new size, Chrome and Telegram for two
        when: The user drags the edge between them, and again at once, widening B under the hand
        then: "Once released, A and B keep the widths the drag left them and nothing moves after: neither B growing under the hand nor a size an app reports late is taken for a window that cannot be narrower"
      - id: taken-other-free
        given: Workspace S has tile A in its left slot and its right slot free
        when: The user tiles window W to the left
        then: A moves to the right slot, keeping its width, and W takes the left one at the width A leaves
      - id: both-taken-explicit
        given: Workspace S has tiles A on the left and B on the right, and window W floats on S or was just brought there
        when: The user tiles W to the left, by key or by a drop at the left edge
        then: W takes the left slot at the width B leaves; A is displaced (behaviour#displacement); the view stays on S
      - id: both-taken-new-window
        given: Workspace S has tiles A on the left and B on the right
        when: A tile-shaped window W opens on S (behaviour#role-by-size#opens-tile-shaped)
        then: "W goes to the right and the view with it: into the free slot of the right-hand neighbour if every tile there also came from S, else onto a new workspace between S and that neighbour; S is W's home (behaviour#going-home)"
      - id: tile-on-full
        given: Workspace S holds full window M, and window W floats on S as a guest
        when: The user tiles W, by key or by a drop at an edge
        then: "As both-taken-new-window: W goes to the right, tiled on the side chosen, and the view with it; M stays where it is"
      - id: untile-same-side
        given: Window W is tiled in the left slot of S
        when: The user presses Super+Left again
        then: W floats again, at the size remembered for its app if there is one, and its slot is free — for a window displaced from it to return (behaviour#displacement#returns-when-free), or for W to go home if it has one (behaviour#going-home)
      - id: untile-kept-on-screen
        given: Window W floated partly off the work area as it became a tile — as a drop at an edge leaves it, pushed against the edge with the pointer
        when: The user untiles W by key
        then: "W floats at the size it had, moved just enough to lie wholly inside the work area (planner#onScreen). Seen 2026-10-18: Nautilus dropped at the left edge kept a float geometry half off the screen"
      - id: linked-resize
        given: Workspace S has tiles A and B
        when: The user resizes A by its inner edge
        then: B is resized to fill exactly the rest of the work area, unless that would leave it under 50px wide
      - id: float-size-remembered
        given: Window W of app X floats at a size the user chose
        when: The user tiles W, by key or by a drop at an edge
        then: "That size is remembered for app X: W, and every window of X after it, floats at that size whenever it is untiled or detached from a tile. A window the extension tiles by itself remembers nothing, since some apps open at the size they were last tiled at and would teach it a tile's size for a float size"
      - id: untile-reopened-tile
        given: App X has a remembered float size; window W of X, closed while it was a tile, opens again at that tile's size — as Nautilus and Mission Center do — and is tiled by its size (behaviour#role-by-size)
        when: The user presses Super+Left or Super+Right to untile W
        then: "W floats at X's remembered size, not at the tile's size it opened with: a window's geometry at opening is never kept as its float size (seen 2026-10-18, when the planner kept it and Nautilus, dragged out of a tile, stayed the shape of one)"
  - id: neighbours-only
    description: "The extension moves a window only onto a workspace next to the one it is on, or onto a new workspace it creates right there, and a window it moves never pushes anything out where it lands: a neighbour that would have to make room — whose slot is taken, or where the window would cover a guest completely — is not suitable, and a new workspace is created instead. A window the user did not move must stay where they can find it, one step from where it was, and one move must never start a chain in which each workspace pushes the window on to the next. A moved tile lands on an empty neighbour, or joins a tile neighbour's free slot only when every tile there came from the same workspace as it did — never a floating or a full neighbour, which it would turn into something else — so two windows the user never put side by side are not made a pair — and so that each goes home on its own terms."
    scenarios:
      - id: joins-sibling-left
        given: Workspace L, left of S, holds tile C in its left slot, displaced there from S, and its right slot is free
        when: Tile B is displaced from S
        then: B takes the free slot of L beside C; the view stays on S
      - id: joins-sibling-other-side
        given: Workspace L, left of S, holds tile C in its left slot, displaced there from S; tile W, registered after C, holds S's left slot
        when: W is displaced from S
        then: W takes L's right slot beside C at the width C leaves, so the two fill the work area — not at a width worked out from W's own, which it would get were it taken for its own partner while it still has its left-tile role (planner#tiles)
      - id: new-left
        given: Workspace L, left of S, holds a tile the user placed there themselves, or is a floating workspace
        when: A tile is displaced from S
        then: It lands on a new workspace created between L and S; L is left as it was; the view stays on S
      - id: joins-sibling-right
        given: Workspace R, right of S, holds tile D that went there from S with the user, and its other slot is free
        when: Another tile-shaped window opens on S with both slots taken
        then: It takes the free slot of R beside D, and the view goes to R
      - id: new-right
        given: Workspace R, right of S, holds tiles the user placed there themselves
        when: A window goes right from S (behaviour#two-slots#both-taken-new-window, behaviour#full-alone)
        then: It lands on a new workspace created between S and R
      - id: would-cover-guest
        given: Workspace L, left of S, has a free slot beside a tile from S, but a guest of L lies where a tile in that slot would cover it completely
        when: A tile is displaced from S
        then: L is not used; the tile lands on a new workspace between L and S, and the guest stays where it is
      - id: no-chain
        given: Any layout
        when: One user action moves a window
        then: Every window moved as a result lands one step from where it was, and no window on the workspace it lands on is moved in turn — a tile coming back to its home slot goes beneath the guests there, so even it covers nobody (behaviour#displacement#returns-under-guests)
  - id: displacement
    description: "A tile pushed out of its slot by the user's explicit choice (behaviour#two-slots#both-taken-explicit) goes to the left, out of view, and remembers the slot it came from; when that slot is free again it comes back. The user chose the newcomer, but the displaced window was there for a reason, and the wall gives it back once nothing holds its place. Slots are a stack: the window displaced from a slot most recently is the first to come back, so freeing a slot gives back what it held last. A displaced tile coming back is not the user's action, so it neither switches the view (behaviour#view-follows-user) nor rises above the guests on its workspace."
    scenarios:
      - id: displaced-left
        given: Workspace S has tiles A on the left and B on the right
        when: The user tiles window W to the left
        then: A goes to the left (behaviour#neighbours-only), out of view, remembering the left slot of S
      - id: returns-when-free
        given: Tile A was displaced from the left slot of S by W
        when: W leaves that slot — closed, untiled, dragged away, minimized, or moved to another workspace
        then: A comes back to the left slot of S at the width B leaves; the view stays where it is
      - id: returns-to-other-side
        given: Tile W was displaced from S's left slot and holds the right slot of the workspace left of S; tile B, registered before W, holds S's right slot
        when: S's left slot becomes free
        then: W comes back to S's left slot at the width B leaves, so the two fill the work area — not at one worked out from W's own width while it still has its right-tile role (planner#tiles)
      - id: last-first
        given: Tile A was displaced from the left slot of S, and later tile C from the same slot
        when: The slot is freed
        then: C comes back; A waits for the next time the slot is freed
      - id: pair-returns
        given: Tiles A and B were both displaced from S, from its left and right slots, and sit together on L
        when: The left slot of S is freed while its right slot is free too
        then: A comes back to the left slot and B to the right, so the pair is back as it was
      - id: not-torn-apart
        given: Tile A was displaced from S onto L, and the user has since tiled window C of their own beside it there
        when: The slot A came from is freed
        then: A stays with C on L, since taking it away would break a pair the user made
      - id: returns-under-guests
        given: A guest floats on top of the tiles of S, and tile A was displaced from S
        when: A's slot is freed and A comes back
        then: A goes beneath the guest, which stays visible and is not moved
      - id: drag-forgets
        given: Tile A was displaced from S onto L
        when: The user drags A
        then: A is detached and floats; it forgets the slot it came from and will not come back to it
      - id: user-move-forgets
        given: Tile A was displaced from S onto L
        when: The user moves A to another workspace
        then: A forgets the slot it came from and will not come back to it
  - id: covered-guests
    description: "Only tiles and full windows cover. A floating window hides nothing, so floating windows lying over one another on a floating workspace are the stack working as meant, not something to solve. A guest that tiles or a full window cover completely is moved where it can be seen: into the free half of its own workspace if it fits there, else onto the floating workspace on the left, else onto a new floating workspace created on the left — and the view does not follow it. Only a window hidden completely is moved, and only as far as it must be, because a window that moves whenever something touches it cannot be found. Whether a guest is covered is asked after every change that can hide one — a tile, a maximize, a resize, a change of stacking — and not only when the stacking changes: tiling a window that is already on top changes no stacking at all, so a check on stacking alone leaves the guest beneath it buried. A guest moved out of the way never comes back by itself, and dragging it does not take it home either: it was floating before and is floating after, nothing about it changed, and it stays where it was put until the user moves it."
    scenarios:
      - id: into-free-half
        given: Floating workspace S holds floating windows F and G
        when: The user tiles window W to the left, so that W covers F completely and G only in part
        then: F is moved sideways into the right half, at its own size; G stays where it is
      - id: to-floating-left
        given: Workspace S has tiles A and B and guest F lying on top of them; workspace L on its left is a floating workspace
        when: The user clicks A, and F ends up beneath the tiles, covered completely
        then: F moves onto L at its own size and place; the view stays on S
      - id: new-floating-left
        given: As to-floating-left, but L is a tile or full workspace, or S is the leftmost
        when: F ends up covered completely
        then: F moves onto a new floating workspace created between L and S; the view stays on S
      - id: too-wide
        given: Workspace S has one tile, and guest F is wider than the free half
        when: F ends up covered completely
        then: F is moved to the left as in to-floating-left, not squeezed into the free half
      - id: together
        given: Several guests of S end up covered completely by the same change
        when: They are moved
        then: They go to the same workspace together, rather than each to a workspace of its own
      - id: partly-visible
        given: Guest F of S is covered in part, not completely
        when: Anything on S changes
        then: F stays where it is
      - id: floaters-overlap
        given: Floating workspace S where floating window G lies wholly beneath floating window F
        when: Anything on S changes
        then: "Nothing moves: floating windows do not cover"
      - id: dialog-stays
        given: A dialog belonging to a managed window on S
        when: Tiles cover the dialog completely
        then: It is not moved away from the window it belongs to
      - id: no-return
        given: Guest F was moved from S onto L because tiles covered it
        when: The tile that covered it closes, or the user drags F
        then: F stays on L; it gets back to S only if the user takes it there in the overview
  - id: view-follows-user
    description: "The view moves only with the window the user acted on: when an action of theirs takes a window to another workspace, the view goes there with it; when the extension moves a window out of the way, or brings one back, the view stays where it is. A workspace switch the user did not cause takes them away from what they were doing, and several moves that each switch the view on their own make the workspaces flip back and forth by themselves. However many windows one action moves, the view changes at most once. And it never leaves a fullscreen window for a window that opened or moved meanwhile: someone in a fullscreen game or video is not to be pulled out of it by an app starting up — neither by the extension nor by GNOME activating the new window, which may switch workspaces by itself when it activates a window (Discord started over Dota once switched the view; on 2026-10-18, with the hold that took the view back removed (executor#run), Discord's window went to a workspace of its own and GNOME left the view on Dota — the view needs no keeping beyond the planner never naming another workspace)."
    scenarios:
      - id: goes-with-user
        given: Workspace S holds window W and others
        when: The user maximizes W (behaviour#full-alone#maximize-shared)
        then: The view goes to W's new workspace
      - id: focus-goes-along
        given: GNOME's focus follows the mouse (focus-mode sloppy, the author's setting); window W, a guest that went right with the user when maximized, is a tile alone on its workspace, and the pointer rests where W will not be once it is home
        when: The user untiles W by key and it goes home with the view (behaviour#going-home#untile-alone)
        then: "W has the keyboard focus, so a second Super+Left/Right acts on it. Seen 2026-10-18 with Nautilus and VS Code: the workspace was shown without naming a window, GNOME gave the focus to what was under the pointer — nothing — and the next key did nothing until the mouse moved"
      - id: focus-goes-along-right
        given: GNOME's focus follows the mouse; window W floats on a workspace with a full window, and the pointer rests over the half W will not take
        when: The user tiles W to the right and it goes right with the view (behaviour#full-alone)
        then: W has the keyboard focus on the new workspace
      - id: stays-for-others
        given: Any layout
        when: A tile is displaced (behaviour#displacement) or a guest is moved away (behaviour#covered-guests)
        then: The view does not change
      - id: stays-for-return
        given: Tile A was displaced from S; the user is now on workspace T
        when: A's slot on S is freed and A comes back
        then: The view stays on T
      - id: opened-elsewhere
        given: The user is on workspace T; an app is opening a window on another workspace S
        when: The window opens on S and needs a workspace of its own
        then: It is placed by the usual rules, and the view stays on T
      - id: once-per-action
        given: Any layout
        when: One action of the user moves several windows
        then: The view switches at most once, to the workspace of the window the user acted on
      - id: fullscreen-stays
        given: The active workspace shows a fullscreen window — a game, a video
        when: Another app opens a window — Discord started over Dota, say — and it gets a workspace of its own, or lands as a guest and is covered
        then: The view stays on the fullscreen window; the new window waits on its own workspace, or on the floating one to the left, until the user goes there
      - id: user-switches-at-once
        given: The active workspace shows a fullscreen window, and another app's window has just opened and gone to a workspace of its own, the view staying (behaviour#view-follows-user#fullscreen-stays)
        when: The user switches to that workspace at once — a swipe, a key
        then: The view stays where the user took it, and GNOME shows that workspace whole — its windows, its overview and the indicator alike
  - id: going-home
    description: "A window that went with the user — given a workspace of its own because it became blocking where there was no room for it (behaviour#full-alone, behaviour#two-slots#both-taken-new-window) — goes home once it stops being blocking: unmaximized, or dragged so that it floats. It no longer needs a place of its own, and the user expects it back where it came from. It goes home only if it would leave no stranger behind: dragged, it goes when every other window on its workspace came from the same home, and stays when it shares the workspace with any other. A home GNOME has removed, being empty, is no home at all: moving a window to a removed workspace takes GNOME Shell down — the old code did so on unmaximize, and Mutter crashed laying the window out (SIGSEGV in meta_workspace_get_work_area_for_monitor, reproduced twice in the test machine on 2026-10-18). Home is taken only as it is: a tile goes back into its old slot if that is free, and never onto a workspace that is now full; a window that floated there before floats there again, on top, whether or not a full window is there now — a full window keeps out tiles, not guests. Floating windows never go home (behaviour#covered-guests): only a window that stopped being blocking has a reason to."
    scenarios:
      - id: unmaximize-to-free-slot
        given: Window W was tiled left on S, was maximized and went to a workspace of its own; the left slot of S is still free
        when: W is unmaximized, or leaves fullscreen
        then: W goes back to the left slot of S, and the view goes to S
      - id: unmaximize-slot-taken
        given: As unmaximize-to-free-slot, but the left slot of S has since been taken by a tile, or S holds a full window now
        when: W is unmaximized
        then: W stays on its own workspace, tiled left there
      - id: home-reordered
        given: As unmaximize-to-free-slot, and then the user drags W's workspace in the indicator to the start of the row, before S and the workspaces ahead of it
        when: W is unmaximized
        then: "W goes back to the left slot of S, wherever S now is in the row, and the view goes there: a home is the workspace itself, not its place in the row"
      - id: unmaximize-was-floating
        given: Window W floated on S, was maximized and went to a workspace of its own
        when: W is unmaximized
        then: W goes back to S floating, at the geometry it had, above the windows there, and the view goes to S, a full window on S or not (behaviour#going-home#unmaximize-was-floating-over-full)
      - id: unmaximize-was-floating-over-full
        given: Window W floated as a guest over full window F on H and went with the user when maximized
        when: The user unmaximizes W — by its button as much as by a key or a double click
        then: W goes home to H and floats over F again, on top, with the view and the focus. A full window at home keeps out a tile, never a guest that floated there before; seen 2026-10-18, when the planner applied that test to Nautilus floating over a maximized Chrome and left it floating alone on its own workspace
      - id: untile-alone
        given: Window W floated as a guest on tile workspace H, was maximized and went with the user to a workspace of its own, and was tiled there by key
        when: The user untiles W by key, alone on its workspace
        then: "W goes home to H floating, on top of H's tiles, and the view goes with it. Seen 2026-10-18 with Chrome: brought home below H's tiles, W was found covered and moved on to a new workspace left of H at once, while the view stayed on the workspace W had left, now empty"
      - id: untile-alone-over-full
        given: Window W floated as a guest over full window F on H, was maximized and went with the user to a workspace of its own, and was tiled there by key
        when: The user untiles W by key, alone on its workspace
        then: W goes home to H floating on top of F, and the view goes with it
      - id: drag-carries-home
        given: Tile W went right from S with the user, and its workspace holds nothing but W and tiles that came from S too
        when: The user drags W past the drag threshold
        then: W floats at its app's remembered size under the pointer and moves to S with it, the view going along; dropped at an edge of S it takes that slot (behaviour#two-slots#both-taken-explicit), dropped anywhere else it floats on S as a guest
      - id: drag-among-strangers
        given: Tile W went right from S, but its workspace also holds a window that did not come from S
        when: The user drags W
        then: W is detached and floats on the workspace it is on; it does not go to S
      - id: drag-full
        given: Full window W went to a workspace of its own from S
        when: The user drags it by its title bar, which unmaximizes it
        then: W floats under the pointer and moves to S with it, as in drag-carries-home
      - id: home-gone
        given: Window W's home workspace has since been removed, being empty
        when: W stops being blocking
        then: W stays where it is, floating or in the slot it had there
  - id: minimize
    description: "A minimized window holds no slot and is never taken for covered. Restored — however that happens: by the user, from the dock or search, or by an app activating it — it goes back to its own workspace and its own slot, with the right to take it: the window there now is displaced (behaviour#displacement) and comes back when the restored one is minimized again. So one slot can cycle between apps without the wall being rearranged by hand. A restore cannot be told apart from an app activating its window, so a link opened in a minimized browser displaces too; the window asked to be seen, and the slot it takes back is its own. Planned: the minimized window shown as a bubble above the other windows, which restores it with a click (see the description)."
    scenarios:
      - id: frees-slot
        given: Window A is tiled in the left slot of S, and tile C was displaced from that slot earlier
        when: The user minimizes A
        then: The left slot of S is free, and C comes back to it (behaviour#displacement#returns-when-free)
      - id: restore-takes-slot
        given: Window A was minimized from the left slot of S, and tile B has been tiled there since
        when: A is restored
        then: A takes the left slot of S again, B is displaced to the left, and the view goes to S
      - id: restore-displaces-returned
        given: Window N, dropped at the left edge of S, displaced tile C; N was then minimized and C came back to the left slot (behaviour#displacement#returns-when-free)
        when: The user restores N
        then: "N takes the left slot again and C is displaced once more, as in behaviour#minimize#restore-takes-slot. Seen 2026-10-18 with Nautilus over Chrome: the restored window still had its old role, the planner took it for the occupant of its own slot, and the two tiles ended up on top of each other — whichever of two windows with one role the planner found depended on the order they were registered in (planner#tiles)"
      - id: cycle
        given: As after restore-takes-slot
        when: The user minimizes A again
        then: B comes back to the left slot of S
      - id: restore-from-elsewhere
        given: Window A was minimized from S; the user is on workspace T
        when: A is restored
        then: A goes back to S, into its slot, and the view goes to S
      - id: restore-full
        given: Full window A was minimized, and its workspace has since received other windows
        when: A is restored
        then: A gets a workspace of its own on the right, which is shown (behaviour#full-alone)
      - id: restore-floating
        given: Floating window F was minimized from S
        when: F is restored
        then: F comes back on S at the geometry it had, above the windows there
  - id: user-moves
    description: "A window the user moves to another workspace themselves — in the overview, or with a keyboard shortcut — is theirs to place. Its home is forgotten, since the user has given it a new one; it is raised above the windows already there, so that being moved does not get it covered and sent away at once (behaviour#covered-guests); and its role there is guessed from what is free, since a move carries no position to go by. A full window moved onto a workspace holding other windows is unmaximized there and placed in the role it had before it became full, rather than sent off to a workspace of its own (behaviour#full-alone): the user chose that workspace, and sending it away undid their move — bringing back a window that had gone right when maximized only made it jump right again (seen 2026-10-18 with Chrome). Choosing the side such a window lands on, rather than having it guessed, is left to the planned drop zones. Planned: drop zones on the overview's workspace previews, so that a window dropped in the middle becomes a guest and one dropped at an edge takes that slot (behaviour#two-slots#both-taken-explicit), without guessing."
    scenarios:
      - id: tile-to-empty
        given: Window W is tiled on the left
        when: The user moves W to an empty workspace
        then: W keeps its side there
      - id: to-one-free-slot
        given: Workspace T has one tile and one free slot
        when: The user moves window W, tiled or floating, to T
        then: W takes the free slot
      - id: to-no-free-slot
        given: Workspace T has both slots taken, or holds a full window
        when: The user moves window W to T
        then: W floats on T as a guest, above the windows there
      - id: floating-to-floating
        given: Workspace T has no tiles
        when: The user moves floating window F to T
        then: F floats on T where it was
      - id: full-back-floating
        given: Window W floated as a guest on tile workspace S and went right with the user when maximized
        when: The user moves W back to S
        then: "W is no longer full: it floats on S above the tiles, the view goes with it and W has the focus"
      - id: full-back-to-slot
        given: Tile W held S's left slot and went right with the user when maximized, leaving the slot free
        when: The user moves W back to S
        then: W is no longer full and takes the left slot of S again, beside the tile there
      - id: forgets-home
        given: Window W has a home — it went with the user, or was displaced
        when: The user moves W to another workspace
        then: W no longer has a home and will not go back to it
      - id: slot-it-left
        given: Tile W is moved by the user off workspace S, and tile C was displaced from W's slot on S
        when: W leaves S
        then: C comes back to that slot (behaviour#displacement#returns-when-free)
  - id: drag-and-snap
    description: "Dragging a window by its title bar decides its role at the drop: at the left or right edge of the work area it is tiled there, at the top edge maximized, anywhere else it floats where it was dropped; while the pointer is in a zone, a preview shows the outcome. There is no bottom edge zone. A click on a title bar is not a drag: a tile is detached, and the zones come alive, only once the pointer has travelled DRAG_THRESHOLD from where it started, because a tile detached by a click would jump to its float size for nothing. A full Android window is never snapped (drag#_onGrabBegin)."
    scenarios:
      - id: click
        given: Window W is tiled
        when: The user clicks its title bar without moving the pointer
        then: Nothing changes
      - id: detach
        given: Window W is tiled in a slot of S
        when: The user drags it past the threshold
        then: W floats under the pointer at its app's remembered size if there is one; its slot is free (behaviour#displacement#returns-when-free) and, if it has a home, it goes there (behaviour#going-home#drag-carries-home)
      - id: detach-reopened-tile
        given: App X has a remembered float size; window W of X opened again at the size it was last tiled at and was tiled by its size
        when: The user drags W out of its slot
        then: "W floats under the pointer at X's remembered size (behaviour#two-slots#untile-reopened-tile). A detached window takes its app's size before its own float geometry, as the extension always did: the app's size is the one the user last chose by hand"
      - id: drop-at-edge
        given: Window W is being dragged
        when: The user drops it at the left or right edge
        then: W is tiled on that side (behaviour#two-slots), and the float size it had before is remembered for its app
      - id: drop-at-top
        given: Window W is being dragged
        when: The user drops it at the top edge
        then: W is maximized (behaviour#full-alone#drop-at-top)
      - id: drop-elsewhere
        given: Window W is being dragged
        when: The user drops it away from every edge
        then: W floats where it was dropped
  - id: emptied-workspace
    description: "When the user empties the workspace they are on, they are not left looking at nothing: by default they go to the workspace on the left, where they most likely came from. The on-empty-workspace setting can make it open the overview instead, or do nothing. Only a workspace the user emptied counts — one emptied by the extension's own moves never moves the view (behaviour#view-follows-user) — and an Android window closing is first given time to be replaced (android#awaitReplacement). Separately, landing on the last workspace, the empty one GNOME keeps at the end, opens the overview when overview-on-last-workspace is on, since the only reason to go there is to start something new."
    scenarios:
      - id: go-left
        given: The user is on workspace S, which holds one window, and on-empty-workspace is left at its default
        when: The user closes that window
        then: The view goes to the workspace on the left of S
      - id: leftmost
        given: As go-left, but S is the leftmost workspace
        when: The user closes the last window on S
        then: The view goes to the workspace on the right if it holds windows, and stays otherwise
      - id: emptied-by-the-extension
        given: The only window on the active workspace S is moved off it by the extension
        when: S is left empty
        then: The view is decided by the move (behaviour#view-follows-user), not by this setting
      - id: last-workspace
        given: overview-on-last-workspace is on
        when: The user switches to the last, empty workspace
        then: The overview opens
  - id: secondary-monitors
    description: "The wall is the primary monitor's. On a secondary monitor the extension arranges nothing: it only stands in for GNOME's own tiling, which it turns off on every monitor so the two cannot race (see the description). There Super+Left/Right and a drag to the left, right or top edge tile and maximize a window as GNOME's edge tiling would, and nothing more — no window is moved to another workspace, displaced, or moved out of the way, and no workspace is created, since with a wall on each screen a move on one would rearrange the others and the user could no longer tell where anything is. This holds whether or not GNOME keeps a secondary monitor's windows on every workspace, as it does by default: turning GNOME's tiling off must not leave those windows with none."
    scenarios:
      - id: key-tiles
        given: Window W is on a secondary monitor
        when: The user presses Super+Left
        then: W fills the left half of that monitor, as with GNOME's own tiling; pressing it again gives W back the size and place it had
      - id: edge-drop
        given: Window W is being dragged on a secondary monitor
        when: The user drops it at the left or right edge, or at the top edge
        then: W fills that half of the monitor, or is maximized there, with the same preview as on the primary monitor
      - id: nothing-arranged
        given: Window W fills the left half of a secondary monitor, and other windows are open there
        when: The user tiles another window V to the left as well, or maximizes V, or V covers a floating window completely
        then: "V is placed as asked and nothing else moves: W stays where it is, no window goes to another workspace or makes room, and no workspace is created"
  - id: android-windows
    description: "Android's windows keep the rules above in the way only they can be kept for them (see the description and the android component for why a Waydroid window is like no other): an app Android shows full screen is a full window, with a workspace of its own like any other (behaviour#full-alone); an app floating inside Android is left alone, never tiled, moved or counted against anything; and a window Waydroid closes and reopens for the same app — on a switch between floating and full screen, a change of theme — takes the place of the one it replaces, so the user sees no workspace come and go."
    scenarios:
      - id: full-screen-own-workspace
        given: Workspace S holds window X; Android is running
        when: An Android app is started and Android shows it full screen
        then: The app's window gets a workspace of its own on the right, which is shown; X stays on S
      - id: floating-left-alone
        given: Workspace S has tiles A and B
        when: An Android app opens floating inside Android
        then: "Nothing moves: the app's window stays where Waydroid put it, A and B keep their slots, and nothing is evicted on its account"
      - id: recreated-keeps-place
        given: An Android app is full screen on a workspace of its own
        when: Android recreates its window — the system theme switches between light and dark
        then: The new window is on that same workspace and the view does not leave it, not even for a moment
      - id: back-to-floating
        given: An Android app went full screen from workspace S onto a workspace of its own
        when: Android shows it floating again
        then: It goes back to S, floating and left alone, and S is shown; the workspace it had is left empty for GNOME to remove
      - id: discover-feed-closed
        given: Android's session was stopped; the user starts an Android app, which brings up Android's boot screen and then the app
        when: The user closes the app, and Android, back at its home screen, brings up the launcher's Google Discover feed as a window of its own (class `waydroid.GoogleDiscoverWindow#<n>`) — not every time; seen on 2026-10-18 in four of seven such sessions, 0.15 s after the app closed, and never when the session was already running
        then: The window is closed as it appears, by the default rule that closes it (gschema, behaviour#window-rules#closed); no workspace is given to it or held by it. Without that rule the extension took it for a full-screen app (android#_fillsWindow) and made it full on a workspace, where it stayed, transparent and empty, until the user closed it — which broke nothing, and Android did not bring it back in that session. In Waydroid's multi-window mode Android's home screen is never shown, so the feed beside it can never be reached, and LineageOS's launcher has no setting to turn it off
  - id: window-rules
    description: "Window rules adjust what the extension does to particular apps; they do not change the rules above. A rule matches windows by class and title and can stick them to all workspaces, keep them on top, give them a fixed geometry, open them on a workspace of their own, leave them alone — never managed, but still shown in the indicator (rules#isIgnored) — or close them as they open, for a window that is of no use and would otherwise take a place (rules#isClosed). A window stuck to all workspaces, a dialog, or one hidden from the taskbar is not part of the wall at all (windows#isRelevant). A rule saved in rules-ui applies at once to the windows already open, except for leaving a window alone and closing it, which only take effect for windows opened after it: closing a window already open, maybe one the user is working in, is not what saving a rule should do."
    scenarios:
      - id: own-workspace
        given: A rule opens Steam's windows on a workspace of their own, and a Steam window is already open on workspace T
        when: Another Steam window opens
        then: It moves to T, joining the other Steam window, and the view goes there
      - id: own-workspace-first
        given: The same rule, and no Steam window is open
        when: A Steam window opens on a workspace that holds other windows
        then: It gets a new workspace of its own; opened on an empty workspace, it stays there
      - id: left-alone
        given: A rule leaves windows of app X alone
        when: A window of X opens
        then: The extension never tiles, maximizes or moves it, and it never covers or displaces anything; the indicator still shows it
      - id: closed
        given: Workspace S has tiles A and B, and a rule closes windows of app X
        when: A window of X opens, maximized
        then: "It is closed as it appears: it gets no workspace of its own, nothing on S moves, and the view stays on S"
  - id: indicator
    description: "The panel indicator shows the wall as it is at every moment — each workspace's button with the icons of the windows on it — and lets the user reorder it. A workspace is reordered by dragging its button and inserting it between two others, as tabs are reordered: the buttons around the insertion point move apart to open a gap where it will go, so where it lands is seen before it is dropped. Dropping it on another button, as before, gave no such sign, and dragging right left it after the target rather than in its place (issue #4). A drag the user takes back — Escape, or a release away from the indicator — changes nothing. The '+' of the last, empty workspace can be dragged the same way, to put an empty workspace in the gap and switch to it. While a drag is under way the indicator is not rebuilt, whatever changes meanwhile; it catches up as the drag ends."
    scenarios:
      - id: icons-follow-window
        given: Workspace S holds windows A and X, workspace T holds window B, and the view is on S
        when: A is moved to T without the view following it, as the extension moves a guest off or another app moves a window
        then: At once T's button shows two icons and S's one
      - id: switch-changes-state-only
        given: Three workspaces holding A, then B and C, then D, the view on the first
        when: The user switches to the second
        then: "The second button is the active one and the buttons show one, two and one icons, and no button or icon was built for it: the switch changed the state of the two buttons concerned"
      - id: drag-between
        given: Four workspaces, holding A, B, C and D in that order, the view on the first
        when: The user drags the first workspace's button and drops it between the third and the fourth
        then: The workspaces are in the order B, C, A, D, and the view stays on A's
      - id: drop-away-cancels
        given: As drag-between
        when: The user drags the first workspace's button and releases it in the middle of the screen
        then: "Nothing changes: the order is A, B, C, D and the view stays on A's"
      - id: escape-cancels
        given: As drag-between
        when: The user drags the first workspace's button between the third and the fourth and presses Escape before releasing it
        then: The buttons move back where they were and nothing changes
      - id: plus-into-gap
        given: Two workspaces holding A and B, and the empty last one with its '+'
        when: The user drags the '+' between A's and B's buttons
        then: An empty workspace stands between A's and B's and the view goes to it
      - id: no-rebuild-mid-drag
        given: The user is dragging a workspace's button
        when: A window opens or closes meanwhile
        then: The drag goes on undisturbed, and the indicator shows the change once it ends
  - id: read-back-at-enable
    description: "When the extension is turned on with windows already open — turned off and on again in a running session, or reloaded — it knows nothing of them, and reads the wall back from how they lie, moving nothing: a window as tall as the work area and touching its left or right edge without spanning it is a tile on that side, a maximized or fullscreen window is full, anything else floats where it is. Two windows that would be tiles on the same side of one workspace leave the side to the one on top, and the other floats. What cannot be seen is not guessed: where a full window was moved from (behaviour#going-home) and which tile is waiting to return (behaviour#displacement) are lost, so those windows stay where they are. Before this, every window but a maximized one was taken as floating, and a wall of tiles lost its tiles (issue #1). At login nothing is open yet, and windows are placed as they open (behaviour#role-by-size)."
    scenarios:
      - id: tiles-read-back
        given: Workspace S has tiles A and B, and the extension is turned off and on again
        when: The user drags the edge between A and B
        then: A and B resize together, as tiles do (behaviour#two-slots#linked-resize)
      - id: lone-tile-read-back
        given: Workspace S has tile A on the left, the right free, and the extension is turned off and on again
        when: The user presses Super+Left on A
        then: A floats again, as a tile does when tiled to its own side (behaviour#two-slots#untile-same-side)
  - id: quiet
    description: "The extension costs nothing while nothing calls for it. It runs all the time, in the shell's main thread, so when the user does nothing, or does what is no business of the extension's — moving or resizing a floating window by hand, an app drawing all the time — it does nothing either; once what it did has settled it stays still, rather than answering its own work or an app's answer to it; and what it holds for windows and workspaces goes when they go. Judged by the performance report (perf), in the test machine."
    scenarios:
      - id: idle
        given: Workspaces with a pair of tiles, a full window and two floating windows, one of them an app drawing at every frame, as a video does
        when: The user does nothing for five seconds
        then: "Nothing of the extension's runs: no handler, later, timer or plan"
      - id: floating-dragged
        given: Two floating windows W and X on a workspace
        when: The user drags W by its title bar to another place on the same workspace
        then: W is where it was dropped and the extension carried out no operation
      - id: floating-resized
        given: Two floating windows W and X on a workspace, apart
        when: The user drags W's bottom right corner to make it bigger
        then: W is bigger and the extension carried out no operation
      - id: work-area-unchanged
        given: A pair of tiles on one workspace and a full window on the next
        when: A workspace is added at the end and removed again, as GNOME's dynamic workspaces do, and Mutter says the work areas changed for each
        then: "Nothing is rechecked or moved: the work area is the one it was"
      - id: still-after-settling
        given: Any of the other scenarios
        when: Its action is done and the windows have settled
        then: "For the next second the extension carries out no operation: a loop with an app, such as two apps resizing each other through it (behaviour#two-slots#resize-slow-pair), shows here even when the windows look still"
      - id: nothing-left-behind
        given: A floating window X
        when: Ten windows are opened and closed one after another, every other one maximized on a workspace of its own
        then: Everything the extension holds — records, handlers, states, for windows and for workspaces — is back to what it was before
functions:
  - id: enable
    description: "Builds the modules and wires them together, turns off Mutter's edge tiling and its Super+Left/Right bindings after saving them (this._savedEdgeTiling, this._savedTileLeft/Right), registers the extension's keybindings, and takes the windows already open under management (windows#adoptExisting). It follows the perf-log setting (perf#setPerf), names what the extension holds to the report (_watchSizes), and exports the extension's D-Bus object on GNOME Shell's own connection, at /org/borshevik/WorkspaceManager with the interface org.borshevik.WorkspaceManager: GetPerfReport, the report as JSON (perf#perfReport), and ResetPerf. Preferences use it, and so does anyone reading the report, with no unsafe mode — in a live session `busctl --user --json=short call org.gnome.Shell /org/borshevik/WorkspaceManager org.borshevik.WorkspaceManager GetPerfReport | gjs -m tests/vm/perf-report.js` prints it as text. disable unexports it and stops collecting. Called at login and when the user turns the extension on — no longer at every unlock, since metadata's session-modes keeps it enabled on the lock screen."
  - id: disable
    description: "Undoes enable exactly: disconnects every signal, removes every timer and later still pending (a plan queued in executor is dropped, not finished), destroys the indicator, the preview and the rules overlay, clears the registry, and restores Mutter's edge tiling and Super+Left/Right bindings to what they were before enable. Windows are left where they are."
  - id: dispatch
    description: "The one way anything gets placed (see the guidelines). Queues an intent and, at the next idle, handles the queue in order, one intent at a time: takes a snapshot (snapshot#take), asks planner#plan for a plan, and waits for executor#run to finish it before planning the next. Intents arriving meanwhile wait their turn; nothing is planned during a frame. After a plan that did anything, the indicator is refreshed (indicator#refresh), and a recheck of the workspaces it touched is queued, so guests covered by what the plan did are found once its windows have settled (behaviour#covered-guests); a recheck that finds nothing plans nothing, which is what ends the chain. With debug logging on, every plan but an empty recheck is logged in full (logPlan). The report (perf) gets every intent queued, credited to the handler it was queued from — one queued while the executor runs is the extension reacting to its own work, and is counted apart — and, per intent type, the time of the whole and of each stage, the plans that came out empty and every operation sent to the executor; _dispatchOne is one intent's way through it."
    arguments:
      - id: intent
        description: what happened, as planner#Intent describes
  - id: _dispatchOne
    description: "One intent taken from the queue at idle: snapshot, plan, execute, each measured under the intent's type (perf#measure), then the refresh and the rechecks dispatch describes, and on to the next."
  - id: logPlan
    description: "Logs one plan in full: the wall it was made from — every window with its workspace, role, rect, place in the stacking, home and float geometry — the intent's details, every operation with its windows, workspaces and rects, the workspace shown and the window focused, and, for every guest moved off as covered, its rect and z and those of each window that counted as covering it (planner#Plan's notes). The short line dispatch logs for each plan names the operations only; a misplacement seen on the author's machine on 2026-10-18 could not be explained from it, which is why the whole plan is written out."
  - id: _watchSizes
    description: "Names to the report (perf#watchSize) what the extension holds: the workspaces and windows in the session, for scale; the registry's managed and ignored windows; the intents waiting; the windows windows follows and their remembered states; the workspace handlers windows and indicator hold, and the work areas windows remembers; the windows executor waits on for a size; Android's watched windows, their actor handlers and its closed windows awaiting a replacement; the indicator's buttons."
  - id: _isRelevant
    description: "What rules-ui needs of the extension: _isRelevant, _applyRuleToAll, _appliedRules and _defer hand it windows#isRelevant, rules#applyToAll, rules#appliedTo and an idle later, so the overlay keeps working against the modules without knowing them."
  - id: _applyRuleToAll
    description: For rules-ui; see _isRelevant.
  - id: _appliedRules
    description: For rules-ui; see _isRelevant.
  - id: _defer
    description: For rules-ui; see _isRelevant.
fields:
  - id: this._intents
    type: Array<planner#Intent>
    description: Intents waiting for dispatch, handled in order at idle, one at a time.
  - id: this._savedEdgeTiling
    type: boolean
    description: Mutter's edge-tiling setting as it was before enable switched it off; restored on disable. this._savedTileLeft and this._savedTileRight are GNOME's own Super+Left/Right bindings, cleared while the extension owns those keys and restored on disable.
