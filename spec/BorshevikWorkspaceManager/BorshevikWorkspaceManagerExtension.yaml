description: "GNOME Shell extension entry point. Replaces GNOME's workspace behaviour with a window manager that keeps the workspaces of the primary monitor as a wall: every window has a place on one of them and each workspace holds one kind of layout, so any window is reached by switching to its workspace, never by Alt+Tab or the overview. A window has one of four roles: floating, tiled left, tiled right, or full (maximized or fullscreen). A workspace's kind follows from its windows: one with a full window is a full workspace and holds no other window of its own; one with tiles is a tile workspace, with two slots, left and right; any other is a floating workspace, a stack where windows may overlap. Floating windows may also sit on tile and full workspaces as guests, for as long as tiles or a full window do not cover them completely. Tiles and full windows are the blocking ones — the ones that need a place to themselves. When the extension moves a window off its workspace, it remembers that workspace as the window's home, for one of two reasons: the window went with the user (it became blocking where there was no room for it), or it was moved out of the way of another window (a displaced tile). The first goes home once it stops being blocking; the second once its slot is free again. What the extension does in each situation, and why, is `behaviour`; its components describe how the code does it.

A panel indicator replaces the Activities button with one button per workspace, showing its windows' icons. Window rules — regex matches on class and title — can stick a window to all workspaces, keep it on top, give it a fixed geometry, open it on a workspace of its own, or leave it alone; they are edited in an in-shell overlay (rules-ui).

Android's windows (Waydroid's) get a treatment of their own, because every one of them is a surface the size of Android's whole display, maximized, with the app drawn on layers inside it where Android placed it: while an app fills its window — Android shows it full screen, or it was maximized inside Android — it has a workspace of its own like any maximized window; while it floats it is left alone, on the workspace it came from (android#watch).

While enabled it turns off Mutter's own edge tiling and takes over Super+Left/Super+Right, so the two cannot race; both are restored exactly as they were on disable. Workspaces are created and windows moved between them on the primary monitor only; secondary monitors get tiling, snapping and maximizing, but never workspaces of their own, which would make the wall a different one on every screen.

State model: what the extension knows about each window is in the registry, owned by the extension and cleared on disable, and a window is managed exactly when it has a record there (see the guidelines on state).

Planned, not built yet, each with its issue in this repository: a minimized window shown as a bubble that restores it (issue #2, see behaviour#minimize), and drop zones on the overview's workspace previews (issue #3, see behaviour#user-moves)."
extends: "@Extension"
target: "@GnomeShell"
platform: GJS (GNOME Shell 49/50) — Clutter, GLib, Meta, Shell, St, Gio
src: borshevik-workspace-manager@komorebinator/extension.js
components:
  - id: log
    type: "@Module"
    src: borshevik-workspace-manager@komorebinator/log.js
    description: "The debug log every module writes to (see the logging guideline): LOG, a no-op or a console.log prefixed '[BWM]'; setLogging, which the extension calls with the debug-logging setting, live; logging, whether it is on, so that dispatch builds its long plan log (logPlan) only then; and name, the way the log names a window."
    functions:
      - id: LOG
        description: Writes to the journal with the '[BWM]' prefix while logging is on; does nothing otherwise.
      - id: setLogging
        description: Turns the log on or off; follows the debug-logging setting.
      - id: logging
        description: Whether the log is on.
      - id: name
        description: "A window as the log names it: its class and Mutter's id, `google-chrome#147594777`. By class alone two windows of one app could not be told apart: a Chrome window of the author's sent on past its home could not be told from the two others Chrome had restored, until the log named each (2026-10-18)."
  - id: perf
    type: "@Module"
    src: borshevik-workspace-manager@komorebinator/perf.js
    description: "The performance report (see the guideline on measuring): how often each signal handler, later and timer of the extension runs and how long it takes, how long each intent spends in dispatch and each of its stages — snapshot, plan, execute — which intents were queued and from where, which plans came out empty, which operations were carried out, the busiest windows by intents and operations, and how much the extension holds now — records, handlers, Android's states, intents waiting. It only counts and times, and judges nothing: no thresholds, no warnings; the numbers are read by the author, by Claude and by the tests (behaviour#quiet). Collected while the perf-log setting is on, from the moment it was switched on or the report last reset; off, a measured point costs one check of a flag. Times are taken with GLib.get_monotonic_time and include whatever a measured point calls, other measured points among them. Imports nothing of GNOME Shell's, so preferences, another process, format the report with it too."
    functions:
      - id: setPerf
        description: Turns collecting on or off; follows the perf-log setting. Switching it on starts a new report; switching it off keeps the last one, closed at that moment, for whoever asks for it over D-Bus — preferences only while it is on.
      - id: resetPerf
        description: "Starts the report anew: every count and time dropped, the period starting now."
      - id: measure
        description: Runs a function counted and timed under a kind (dispatch, snapshot, plan, execute, handler, later, timer) and a name; an intent queued while it runs is credited to it, the innermost one, as what caused it.
      - id: handler
        description: "A signal handler wrapped in measure under 'handler' and the name it is reported by, `<module>: <signal>`. Every handler of the extension's own is connected through it, so the report misses none (see the guideline)."
      - id: count
        description: "Counts something with no time of its own: an empty plan, an intent queued while the executor ran."
      - id: noteDispatch
        description: An intent queued, by its type and windows; credited to the measured point running, or counted as from outside any — a keybinding not wrapped, say.
      - id: noteOp
        description: An operation of a plan, by its kind and window, counted as it goes to the executor.
      - id: watchSize
        description: Names something the extension holds and how to read its size; read when a report is asked for, so a leak shows as growth once windows and workspaces are gone (behaviour#quiet#nothing-left-behind).
      - id: perfReport
        description: "The report as an object, what GetPerfReport sends as JSON: the period it covers, in local time and seconds, so rates can be worked out, and every count, time and size."
      - id: formatReport
        description: "The report as text, for preferences' Copy and tests/vm.sh perf: one table per kind of measured point — calls, calls per minute, total and longest time, intents caused — then the intents, empty plans, operations, busiest windows and sizes."
  - id: workspaces
    type: "@Module"
    src: borshevik-workspace-manager@komorebinator/workspaces.js
    description: "Telling the workspaces GNOME still has from those it has removed. A removed workspace lives on as an object for as long as something holds it — a home, an Android window's origin, a handler — and index() on it returns -1 but fails Mutter's assertion, a critical in the journal each time (`meta_workspace_index: assertion 'ret >= 0' failed`, seen in the test machine, 2026-10-20); every check of whether a workspace is still there goes through isLive instead."
    functions:
      - id: liveWorkspaces
        description: The workspaces GNOME has now, as a set.
      - id: isLive
        description: Whether a workspace is still one of them.
      - id: wsIndex
        description: "A workspace's index, or -1 once removed — for the log above all, whose arguments are worked out even while it is off."
      - id: dropRemovedWorkspaces
        description: "A list of [workspace, handler id] with the handlers of removed workspaces disconnected and dropped, for windows and indicator at every workspace-removed: kept, they piled up for as long as the extension was on."
  - id: registry
    type: "@Singleton"
    src: borshevik-workspace-manager@komorebinator/registry.js
    description: The extension's record of every window it manages and every window a rule leaves alone. A window is managed exactly when it has a record. Owned by the extension and cleared on disable (see the guidelines on state); read by snapshot#take, written by the adapters when windows come and go and by executor as it acts.
    fields:
      - id: this._records
        type: Map<Meta.Window, record>
        description: One record per managed window, deleted when the window is unmanaged.
      - id: this._ignored
        type: Set<Meta.Window>
        description: "Relevant windows a rule leaves alone (rules#isIgnored), or Android windows while they float (android#_check): never placed, tiled, moved or maximized, yet still relevant — the indicator shows them and an emptied workspace counts them."
      - id: record
        type: plain object
        description: "What the extension knows about one window that the window itself does not say. `role`: 'floating' | 'tiled-left' | 'tiled-right' | 'full' — the single source of truth for which role the window has. `preFull`: the role to go back to when it stops being full. `home`: {ws, kind: 'with-user' | 'displaced', slot, seq} or null — the workspace it was moved off, why (behaviour#going-home, behaviour#displacement), the slot it held and, for a displaced one, a number that grows with every displacement, so the most recent one returns first. `floatRect`: {x, y, width, height}, its floating geometry — written only from manual actions (an explicit tile, a drop) or while it floats undisturbed, never on a path the extension took by itself: some apps, Mission Center among them, open at the size they were last tiled at, and capturing on an automatic path recorded a tile's size as the user's float size — and, through float-sizes, for the whole app; this happened once already, when the capture sat in code both kinds of path ran. `minimizedFrom`: {ws, slot} while minimized (behaviour#minimize). `lastWs`, `lastMonitor`: where it was last placed — written by executor before it moves the window, so the workspace-changed that follows matches and is an echo, and read instead of the live accessors once the window is unmanaging, when get_monitor() already returns -1. `tileRect`: the rect executor last gave the window as a tile — what the snapshot reads for a tile instead of its live rect, since an app takes a moment to accept a new size, and a plan made from a live rect read meanwhile undid the tile it had just made (seen in the test machine, 2026-10-18: every tile went back to its float width at the recheck that followed it). A hand resize and a window settling wider than asked report their real width (drag#_onGrabEnd, executor#_applyGeometry), which then becomes the tileRect. `placed`: false while the window waits for its own opened intent (windows#register) — the snapshot leaves it out of every plan but its own opened one, since a plan made meanwhile counted a maximized window not yet placed and moved a floating one out of its way (seen in the test machine, 2026-10-18). `pendingRect`: the rect executor gave a window just brought out of maximize, until it takes it at its next size (executor#_applyGeometry) — what the snapshot reads for it meanwhile. `ownWsRule`: the id of the own-workspace rule it matches (rules#ownWorkspaceRule), or null. `rules`: Set of the ids of the rules that matched it, shown by rules-ui and used to gather the windows of an own-workspace rule."
    functions:
      - id: get
        description: The record of a window, or undefined when the extension does not manage it.
      - id: track
        description: Starts managing a window with a fresh record; a window a rule left alone stops being ignored.
      - id: forget
        description: Drops a window's record, so it is no longer managed — when it closes, and when an Android app floats again.
      - id: drop
        description: Forgets a closed window entirely, managed or ignored.
      - id: windows
        description: Every managed window, for snapshot#take.
      - id: ignore
        description: Marks a relevant window as left alone (this._ignored).
      - id: isIgnored
        description: Whether a window is left alone.
      - id: clear
        description: Forgets everything, on disable.
  - id: planner
    type: "@Module"
    src: borshevik-workspace-manager@komorebinator/planner.js
    description: "Every decision about where a window goes, as pure functions: a snapshot of the primary monitor's wall and an intent in, a plan out. It keeps `behaviour` — each function names the behaviours it decides — and imports nothing from `gi://`: workspaces and windows reach it as opaque references it compares but never calls, so it runs under plain gjs, and the scenarios can be checked against it without a GNOME Shell (tests#planner-scenarios). It works on a copy of the snapshot, changing it as it decides, so that each later decision in the same plan sees the wall as the earlier ones left it."
    fields:
      - id: Snapshot
        type: plain object
        description: "{workArea, activeWs, workspaces: [{ws, windows: [w]}]}, the primary monitor's workspaces in order, the active one among them. Each w: {win, role, rect, z — its place in the stacking, higher is above —, minimized, fullscreen, above, home, preFull, minimizedFrom, floatRect, appFloatSize — the size remembered for its app, as fractions of the work area —, minWidth — the narrowest its app says its window can be, as a frame width, 0 if it says nothing (snapshot#take) —, transientFor, ownWsRule}. Whether a fullscreen window is shown is read from the active workspace's windows (plan), not kept apart. Built by snapshot#take, or by hand in a test."
      - id: Intent
        type: plain object
        description: "What happened, one of: opened {wins} — a window just opened, each in an intent of its own (windows#register); closed {win, ws, slot}; tile {win, side, explicit}; untile {win}; full {win} and unfull {win} — maximized or fullscreen, and back; detached {win} — a drag passed the threshold; dropped {win, zone}; userMoved {win, from}; minimized {win}; restored {win}; resized {win, width} — a tile resized by hand, to the width it has now; recheck {ws, relayout} — the stacking changed, or with relayout the work area did; returnTo {win, ws, show} — a window outside the wall, a floating Android app, to be put back on a workspace (android#_return, android#claimPlace), shown only if `show` and the view rules allow."
      - id: Plan
        type: plain object
        description: "{ops, activate, focus, touched, notes}. ops, in the order they must run: newWorkspace {ref, before | after} — a workspace beside another, named by ref for the later ops; move {win, ws}; tile {win, side, rect}; full {win, preFull}; float {win, rect, keepPosition} — rect null when nothing is known, keepPosition while a drag holds the window; place {win, x, y} — a guest moved sideways; home {win, home}; floatRect {win, rect} — the geometry a floating window had as it stops floating; floatSize {win, rect} — remember that size for its app; minimizedFrom {win, value}; raise {win}; lower {win, below}. activate: the one workspace to show afterwards, or null (behaviour#view-follows-user). focus: the window to focus as it is shown — the one the user acted on, or the first opened, when it is on that workspace — or null (behaviour#view-follows-user#focus-goes-along). notes: why each guest was moved off as covered — its rect and z and those of the windows that covered it — for the debug log only. touched: the workspaces whose layout changed, rechecked by dispatch once the plan has settled."
      - id: FULL_SHARE
        default: 0.9
        description: The share of the work area, both ways, beyond which a new window is made full (behaviour#role-by-size).
      - id: TILE_SHARE
        default: "[0.2, 0.8]"
        description: The range of widths, as shares of the work area, at which a full-height new window is taken for a tile; the upper bound is also the most a tile alone on its workspace keeps (behaviour#role-by-size#opens-tile-shaped).
    functions:
      - id: plan
        description: "The plan for one intent: hands it to the function that decides it, then, for every workspace whose layout changed, evicts the guests the change covered (_evictCovered) and picks the workspace to show — that of the window the intent was about, when the user acted on it and no fullscreen window is active, else none (behaviour#view-follows-user) — and the window to focus there, that same window (behaviour#view-follows-user#focus-goes-along). Throws nothing for an intent about a window absent from the snapshot; it plans nothing."
        arguments:
          - id: wall
            description: planner#Snapshot
          - id: intent
            description: planner#Intent
      - id: _opened
        description: "Places a window just opened on the wall as it is, the windows opened before it already placed and those still waiting left out (`placed` in registry#record): a window an own-workspace rule claims joins that rule's workspace or gets one (behaviour#window-rules#own-workspace); any other gets the role _roleBySize gives it, a full one moving right (_goRight) if its workspace holds anything else (behaviour#full-alone), a tile taking a free slot or moving right when there is none (behaviour#two-slots#both-taken-new-window). The size is judged here and never again (behaviour#role-by-size#not-judged-again)."
      - id: _roleBySize
        description: The role a new window's size suggests (behaviour#role-by-size), from FULL_SHARE and TILE_SHARE.
      - id: _tile
        description: "Puts a window in a slot (behaviour#two-slots): into a free one at the width its neighbour leaves; into a taken one with the other free by moving the occupant across at its width; into a taken one with both taken by displacing the occupant (_displace) if the user chose the slot, or by going right (_goRight) if not; on a full workspace by going right. An explicit tile of a floating window remembers its size for its app first (behaviour#two-slots#float-size-remembered)."
      - id: _displace
        description: "Moves a tile out of its slot to the left (behaviour#displacement): onto the left neighbour when _neighbour finds it suitable, else onto a new workspace between the two, recording the slot it came from as a displaced home with the next seq."
      - id: _goRight
        description: "Moves a window that became blocking where there is no room for it to the right (behaviour#full-alone, behaviour#two-slots#both-taken-new-window): a full one onto the right neighbour if that is empty, a tile into the neighbour's free slot if _neighbour finds it suitable, otherwise onto a new workspace between the two; records a with-user home, and the view goes with it (subject to plan)."
      - id: _neighbour
        description: "Whether a neighbouring workspace can take a tile (behaviour#neighbours-only): an empty workspace always can; otherwise it must be a tile workspace — a floating or a full one never is — with the slot free, every tile already there having the same home workspace as the window, and no guest there that the window would cover completely. Only ever the immediate neighbour, never one further along."
      - id: _becomeFull
        description: "A window became full: remembers the role to go back to and, if its workspace holds any other managed window of the primary monitor, sends it right (_goRight) (behaviour#full-alone). A window already full is left as it is, which would otherwise overwrite the role to go back to."
      - id: _stopBlocking
        description: "A window stopped being blocking — unmaximized, left fullscreen, detached by a drag (behaviour#going-home): with a with-user home it goes back there in its previous role — a tile if its slot there is free and the home holds no full window, floating on top if it floated before, a full window at home or not (behaviour#going-home#unmaximize-was-floating-over-full); with its home taken it keeps its role where it is. Dragged, it goes home only while every other window on its workspace shares that home, and travels with the pointer, at its app's remembered size before its own floatRect (behaviour#drag-and-snap#detach-reopened-tile). A displaced home is forgotten instead (behaviour#displacement#drag-forgets). Either way the slot it leaves is freed (_freeSlot)."
      - id: _freeSlot
        description: "A slot was freed: brings back the displaced window with the highest seq whose home is that slot (behaviour#displacement#last-first), unless it now has a partner of its own beside it (behaviour#displacement#not-torn-apart), and its displaced partner from the other slot of the same workspace with it if that slot is free too (behaviour#displacement#pair-returns). The returning window goes beneath the guests there (lower) and does not take the view."
      - id: _evictCovered
        description: "Moves the guests of a workspace that tiles or a full window now cover completely (_isCovered) where they can be seen (behaviour#covered-guests): sideways into the free half if it fits, else onto the left neighbour if that is a floating workspace, else onto a new floating workspace on the left — those moved by one change together. Dialogs of a managed window, windows above all others, and a window the user has just moved there and raised are never covered by definition; on a secondary monitor nothing is evicted (behaviour#secondary-monitors)."
      - id: _isCovered
        description: "Whether a guest is hidden completely: off the work area, or its visible width covered by tiles and full windows stacked above it that overlap it vertically. A one-dimensional sweep is enough, because everything that covers is as tall as the work area; floating windows never count (behaviour#covered-guests#floaters-overlap)."
      - id: _userMoved
        description: "Places a window the user moved to another workspace (behaviour#user-moves): forgets its home, raises it, and gives it the role the free slots allow; a full window keeps being full only where it is alone, and among other windows takes its preFull role first and is placed like any other, floated explicitly when no slot takes it so that it is unmaximized. The slot it left on its old workspace is freed (_freeSlot)."
      - id: _minimized
        description: "A window was minimized: records the workspace and slot it held and frees the slot (_freeSlot) (behaviour#minimize)."
      - id: _restored
        description: "A minimized window came back: a tile retakes its slot on its own workspace, displacing whatever holds it (_displace); a full one is placed as any window becoming full; a floating one returns on top. The view goes to it (behaviour#minimize)."
      - id: _fit
        description: "Keeps the two tiles of a workspace filling it exactly (behaviour#two-slots#linked-resize, behaviour#two-slots#narrow-remainder): after a tile is resized by hand the other takes the rest, unless that would leave it under 50px. Neither is made narrower than its smallest width (setTile)."
      - id: _relayout
        description: "Brings the tiles of a workspace back to the work area after it changed — resolution, scale, a monitor, the panel (a recheck with relayout): same width, the slot's edge and full height. Only then: a recheck after a click or a plan does not relayout, since a tile whose app has not yet taken its new size would be laid out from where it was. Roles are not judged again (behaviour#role-by-size#not-judged-again)."
      - id: setTile
        description: "Makes a window a tile on a side at a width, never narrower than its smallest width (planner#Snapshot's minWidth): asked for less, an app keeps its smallest width and the two tiles overlap. A partner that would then overlap gives up just as much, down to its own smallest width, and past that the window itself gives way (behaviour#two-slots#narrow-remainder). The smallest width is the one the app declares, read before anything is asked of it, where it was once found by watching a tile settle wider than asked: a watch that took the hand's resize and apps' late sizes for settled widths, and twice ended in two apps resizing each other without end (2026-10-19)."
      - id: tiles
        description: The windows in a workspace's two slots, read from their roles, leaving out the window being placed. A window being placed still has its old role — a restored one the slot another took meanwhile, a moved one the side it had where it came from — and when two windows had one role, which of them counted as the occupant depended on the order they were registered in (behaviour#minimize#restore-displaces-returned).
      - id: onScreen
        description: "A window's own float geometry as it floats again, shifted — and shrunk if it is larger than the work area — to lie wholly inside the work area. The geometry is kept at the moment a floating window stops floating, and that moment can find it partly off the screen: a drop at an edge leaves it pushed against the edge by the pointer, and a screen may have changed since. Shifting it there, rather than keeping the geometry from before the drag, keeps one rule for every way a window floats again (behaviour#two-slots#untile-kept-on-screen). Not applied while a drag holds the window, which floats under the pointer."
  - id: snapshot
    type: "@Module"
    src: borshevik-workspace-manager@komorebinator/snapshot.js
    description: Builds the planner#Snapshot from the live windows and the registry, fresh for every plan and never cached, so the planner always decides on the wall as it is. Of the primary monitor only, since the wall is that monitor's (behaviour#secondary-monitors).
    functions:
      - id: take
        description: "The snapshot of the primary monitor's wall: every workspace in order, each with its managed windows on that monitor, their roles and homes from the registry, their frame rects, their stacking order (global.display.sort_windows_by_stacking), and the work area. A workspace's work area is read from the workspace itself, so an empty workspace has one too — the old code skipped empty workspaces as though theirs could not be read; that is to be confirmed, and carried over only if it turns out true. Ignored windows, windows on all workspaces and windows still waiting for their opened intent (`placed` in registry#record) are left out — the last unless the plan is their own opened one. A floating window's floatRect is its live rect, except for a window just opening, whose live rect may be a tile's it opened at: its floatRect is the record's (windows#register). A window's minWidth is the minimum its app declares (xdg_toplevel.set_min_size on Wayland, WM_NORMAL_HINTS on X11), which Mutter keeps in client coordinates, shadows included: get_min_size, less what frame_rect_to_client_rect adds to the frame rect. Read in the test machine on 2026-10-19: Chrome declares 500, Nautilus 360. A window just brought out of maximize is read at its pendingRect, where it was put, until it takes it."
  - id: executor
    type: "@Singleton"
    src: borshevik-workspace-manager@komorebinator/executor.js
    description: Carries out a planner#Plan through Mutter, one operation at a time, and holds every workaround for the ways Mutter and the apps do not do at once what they are told. Before each operation that changes a window it writes the outcome into the window's registry record (its role, its lastWs), so the signals that follow are recognised as echoes (see the guidelines).
    fields:
      - id: this._running
        type: boolean
        description: True while a plan is being carried out; dispatch plans nothing until it is false again.
      - id: this._pending
        type: Map<Meta.Window, handler id>
        description: "Per window, the one size-changed handler waiting for its next size (_onNextSize): the rect put back after an unmaximize, or a floating window centred."
    functions:
      - id: run
        description: "Carries out the operations of a plan in order and then shows the workspace it names, if any, calling `done` once it is all asked of Mutter: nothing waits for a window to take its geometry (_applyGeometry). A failing operation is logged and skipped (see the guidelines). Whether to show a workspace is the planner's, and so is which window to focus there: the workspace is shown with that window focused (activate_with_focus), since showing it alone leaves the focus to GNOME, which, when focus follows the mouse, gives it to whatever is under the pointer or to nothing (behaviour#view-follows-user#focus-goes-along). Nothing else here moves the view. A hold once took the view back to a fullscreen window for 1.5 s after a plan that moved windows off it, against GNOME switching to one of them by itself — a case never confirmed — but it could not tell the user's own swipe from such a switch, took the view back in the middle of the swipe's animation and left GNOME showing one workspace while its overview and indicator stood on another (2026-10-18), so it was removed (behaviour#view-follows-user#user-switches-at-once)."
        arguments:
          - id: plan
            description: planner#Plan
          - id: done
            description: called when the plan is finished
      - id: isMoving
        description: "Whether the executor is moving a window this very moment: window-removed is emitted from inside change_workspace, before anything can be compared, so windows#_onWindowRemoved asks this instead. True only for the duration of that call."
      - id: _newWorkspace
        description: "Creates a workspace at an index: appended, then moved into place. The window meant for it is moved there in the same operation sequence, before anything idles, so the workspace is never empty when GNOME looks."
      - id: _move
        description: Moves a window to a workspace, as an echo-marked change. A window on all workspaces is never moved.
      - id: _unfull
        description: Brings a window out of maximize or fullscreen before it is given a tile or a floating geometry, with a plain unmaximize or unmake_fullscreen; making a window full is a plain maximize in run. Marks the window so _applyGeometry applies its rect once more on the next size-changed. It once also told GNOME Shell the change was an unmaximize, so that it animated as one, through Main.wm._prepareAnimationInfo — a private function of GNOME Shell, with no promise to stay, which logged `Error in size change accounting` at every use (2026-10-18) — and was dropped for it.
      - id: _applyGeometry
        description: "Gives a window a rect: moves it, then resizes it, since some apps ignore the move half of a combined call. After an unmaximize Chrome restores its old position once the new geometry is applied, so the rect is applied again at the window's next size-changed (_onNextSize), applied only while the window still has the role it was given; until then the window is taken to be where it was put (pendingRect in registry#record, read by snapshot#take), so the plan does not wait for it and no plan is made from where it is on its way. The plan once waited up to 2 seconds for that size instead, holding every intent behind it."
      - id: _float
        description: Floats a window at the rect the planner chose — its floatRect, else its app's remembered size centred on the work area; for a detached one its app's size first (planner#_stopBlocking) — else, a window that opened maximized and has neither, centred at whatever size it settles at after unmaximizing (_onNextSize), rather than at an arbitrary default; the plan does not wait for that either.
      - id: _onNextSize
        description: "Runs something once, at a window's next size-changed, replacing whatever that window waited for: there is no deadline, since nothing waits for it, and it is dropped by the next geometry given the window or a grab on it (forgetPending)."
      - id: forgetPending
        description: "Drops what a window waits for at its next size, and its pendingRect: when it is given a new geometry, when the hand grabs it (drag#_onGrabBegin), and on disable."
      - id: _restack
        description: Lowers a window beneath others (a returning tile beneath the guests, behaviour#displacement#returns-under-guests) or raises it above them (a window the user moved, behaviour#user-moves).
  - id: windows
    type: "@Singleton"
    src: borshevik-workspace-manager@komorebinator/windows.js
    description: "The adapter between Mutter's window and workspace signals and dispatch: it takes windows under management as they appear, follows what happens to them, drops the echoes of the extension's own actions (see the guidelines) and turns everything else into intents. It decides nothing about placement."
    fields:
      - id: this._connected
        type: Map<Meta.Window, handler ids>
        description: The windows whose signals register has connected, with the handler ids to disconnect on disable; a window is connected once however many times it is registered, and every handler does nothing while the window has no record.
      - id: this._seen
        type: Map<Meta.Window, {full, minimized}>
        description: "The full and minimized state last acted on, per window: the two maximized-* notifies of one operation, and a minimize Mutter reports more than once, are each acted on once."
      - id: TILE_SIGHT_PX
        default: 10
        description: How far from the work area's edges and height a window may lie and still be read back as a tile at enable (_tilesBySight).
      - id: this._restackLater
        type: later id or 0
        description: "The recheck queued for the next idle after restacked (_onRestacked): Mutter emits restacked in bursts, and one recheck answers the whole burst. An 80 ms debounce stood here before, a timer with nothing to wait for."
      - id: this._wsHandles
        type: Array<[Meta.Workspace, handler id]>
        description: "The window-removed handler on every workspace (_onWindowRemoved), connected for each one as GNOME adds it. Those of a workspace GNOME removes are dropped at its workspace-removed (workspaces#dropRemovedWorkspaces): kept until disable, one piled up for every workspace a maximized window had held (found by behaviour#quiet#nothing-left-behind, 2026-10-20)."
      - id: this._areas
        type: Map<Meta.Workspace, string>
        description: "The primary monitor's work area each workspace was last laid out for, as `x,y wxh` (_readAreas). A Map pruned at every workspace-removed rather than a WeakMap: a GJS wrapper may be made anew for the same workspace, and a WeakMap would then lose the entry and miss a real change; its size is in the performance report."
    functions:
      - id: isRelevant
        description: "Whether the extension manages a window at all: normal windows only, not hidden from the taskbar and not on all workspaces. Dialogs, docks and sticky windows are left alone everywhere — placement, the indicator and rules-ui. Secondary monitors are the exception to the last clause: their windows are on all workspaces when GNOME keeps workspaces on the primary monitor only, and must still get the tiling that replaces GNOME's (drag, behaviour#secondary-monitors)."
      - id: _onWindowCreated
        description: "Starts managing a new relevant window once it has a size to be judged by: at its first frame, or at its first size-changed with a size, whichever comes first — unless it has been registered meanwhile (a grab on a window never announced, drag#_onGrabBegin), a rule closes it (rules#isClosed), which it then asks to close at the next idle, never managing it, a rule leaves it alone (rules#isIgnored), or it is Android's (android#isAndroid), which goes to android instead. The rules and the Android test are asked then and not at creation because a Wayland client names its app id after its window is created: at creation wm_class is still empty, and a test on class would match nothing — Waydroid's windows slipped through this way. An X11 window has its class and its geometry from its creation and may never change size, so one that already has a size is decided at the next idle after it. Nothing is moved, or closed, from the first-frame handler (see the guidelines). A window that opens on a workspace not being shown draws no frame until it is shown, but it is given a size, so the first size is what takes it under management: Chrome restoring a session sends the view after its first window, and the windows opening behind it were left unmanaged until the user happened to look (both the old code and the first version of this one; seen in the test machine, 2026-10-18). A fixed wait of half a second stood in for that size before, and judged a slow window at 0×0 (behaviour#role-by-size#slow-to-open)."
      - id: register
        description: "Takes a window under management: gives it a record (registry#track) with its role read from Mutter — the one place besides adoptExisting where Mutter's flags stand in for the record — or, at enable, the tile adoptExisting saw it to be, with what it covers as its tileRect; seeds its floatRect from its app's remembered size centred on the work area (_appFloatRect), else from its geometry unless it opened maximized, applies the window rules (rules#apply, deferred), connects its signals once (this._connected), since an Android window can be registered again after being released, and, for a window just opened, dispatches its opened intent at once: each window is placed on its own, as soon as it is ready. Windows opening together — Chrome restoring a session — were once gathered for 150 ms and placed in one plan, a crutch from the old code, where windows placed one by one overlapped or were left on one workspace; the planner places each on the wall the ones before it left (behaviour#role-by-size#session-restore). The app's size comes first because an app may open at the size it was last tiled at (behaviour#two-slots#untile-reopened-tile)."
      - id: _appFloatRect
        description: The float-sizes entry of a window's class as a rect centred on its monitor's work area, or null when its app has none.
      - id: close
        description: "Asks a window a rule closes (rules#isClosed) to close, at the next idle and only if it is still there, as the close button would — an app may still ask about unsaved work. The window is never registered or ignored, so nothing else counts it meanwhile. The request carries a time read from the display server (get_current_time_roundtrip): outside an event global.get_current_time() is 0, and Mutter, which pings a window it asks to close to see whether it answers, refuses to ping with that (seen 2026-10-18 on the Discover window; it closed all the same)."
      - id: ignore
        description: Leaves a relevant window alone (registry#ignore) — a rule says so, or it is a floating Android app — while still following its closing, and applies the window rules' other actions to it at the next idle.
      - id: _onUnmanaged
        description: "A managed window closed: dispatches closed with the workspace and slot it held, read from the record's lastWs and lastMonitor since the live accessors are unreliable by then, and forgets it."
      - id: _onWorkspaceChanged
        description: "A window changed workspace: an echo, or only the index shift of a workspace appearing or disappearing elsewhere, changes nothing; a change the user made dispatches userMoved."
      - id: _onMaximizeChange
        description: "Follows maximize and fullscreen changes. Both notify::maximized-horizontally and notify::maximized-vertically fire for one operation, the first while the window is maximized one way only, so the combined state alone is compared with the record and acted on once: becoming full dispatches full, ceasing unfull, a match is an echo. During a drag Mutter unmaximizes the dragged window at once, and that is left to drag, which knows it is one (drag#_onGrabBegin). Entering and leaving fullscreen is logged even when it changes nothing here, as from maximized to fullscreen and back, so the logs show when a window was fullscreen."
      - id: _onMinimizedChange
        description: Dispatches minimized or restored as a window is minimized or comes back, however it came back (behaviour#minimize).
      - id: _onWindowRemoved
        description: "A workspace lost a window other than by the extension's own move. Whether it was closed or moved elsewhere is known only once unmanaging has finished, so it decides at the next idle: a closed Android window waits for its replacement (android#awaitReplacement); any other loss asks _leaveIfEmpty."
      - id: _leaveIfEmpty
        description: "When the active workspace loses its last window to the user (behaviour#emptied-workspace) — at once, or ANDROID_REPLACE_MS after an Android window closed unreplaced — follows the on-empty-workspace setting: go to the workspace on the left, or the one on the right if this was the leftmost and that one has windows; open the overview; or do nothing. An emptied workspace counts the windows a rule leaves alone."
      - id: _onActiveWorkspaceChanged
        description: With overview-on-last-workspace on, arriving on the last workspace while it is empty opens the overview (behaviour#emptied-workspace#last-workspace).
      - id: _onRestacked
        description: "After the stacking changed, once for a whole burst of restacked at the next idle (this._restackLater), dispatches recheck for the active workspace: a click that puts a tile above a guest can cover it, and that is a change of the user's, not one any plan made."
      - id: _onWorkAreasChanged
        description: "After the work area changed — resolution, scale, a monitor, the panel — dispatches recheck with relayout for each workspace whose primary work area is no longer the one remembered (_readAreas), so tiles are laid out on the new area and guests it covers are found. Roles are not judged again (behaviour#role-by-size#not-judged-again). Mutter sends workareas-changed whenever it recomputes the work areas, and it does so for every workspace added or removed, the areas themselves unchanged (seen in the test machine, 2026-10-20): until then every one of them rechecked every workspace for nothing, 69 empty rechecks for 13 workspaces come and gone in two minutes of the author's session (found with perf). The state is what is judged, not the signal (behaviour#quiet#work-area-unchanged)."
      - id: _readAreas
        description: "Reads every workspace's work area on the primary monitor into this._areas and returns the workspaces whose area is not the one remembered. A workspace seen for the first time is remembered and not returned: it holds nothing to lay out yet. Read once at enable."
      - id: adoptExisting
        description: "At enable, takes every relevant window already open that no rule closes or leaves alone under management where it is, without moving it, with the role it is seen to have (behaviour#read-back-at-enable): maximized and fullscreen ones as full, to go back to floating since their real prior role is unknown; those _tilesBySight finds as tiles on that side, their tileRect what they cover now; the rest as floating at their present geometry. One a rule closes is closed, as it would have been had the extension been on when it opened. Needed because after a shell restart some windows — Chrome web apps among them — come back without the signals new windows send, and would otherwise stay untracked, so a new window opening beside them would take their workspace for empty, and because turning the extension off and on again in a running session would otherwise leave the wall without its tiles. Android windows go to android#adoptExisting."
      - id: _tilesBySight
        description: "Which of the windows already open at enable lie as tiles, and on which side: relevant, on the primary monitor, not minimized, maximized or fullscreen, not Android's and not closed or left alone by a rule, as tall as the work area of their workspace and touching its left or right edge without spanning its width, each within TILE_SIGHT_PX — a window that settled a little wider or taller than it was tiled still counts. Where two would take the same side of one workspace, the one higher in the stacking order does. Only the primary monitor's: tiles on another monitor are drag's plain tiles, which keep no role (drag#_plainTile)."
  - id: drag
    type: "@Singleton"
    src: borshevik-workspace-manager@komorebinator/drag.js
    description: "Dragging by the title bar, resizing a tile by hand, and Super+Left/Right: follows the grab, shows the snap preview, and dispatches what the user did (behaviour#drag-and-snap). On a secondary monitor it stands in for GNOME's own tiling instead, by itself and without the planner, since nothing there is arranged (behaviour#secondary-monitors)."
    fields:
      - id: SNAP_PX
        default: 32
        description: How close to a work-area edge the pointer must come for that edge's zone — left, right, or top to maximize.
      - id: DRAG_THRESHOLD
        default: 20
        description: How far the pointer must travel from where a drag started before a tile is detached and the zones come alive, so a click on a title bar is not a drag.
      - id: this._drag
        type: "{win, startX, startY, detached, plain, blocking} | null"
        description: "The drag in progress: `plain` for a window on a secondary monitor, which only gets GNOME's tiling (_plainTile); `blocking` when the window was a tile or full as the grab began, so a pass of the threshold detaches it. Set before anything else when the grab begins, because Mutter unmaximizes a dragged window at once and that unmaximize must already be known for part of a drag (windows#_onMaximizeChange)."
      - id: this._zone
        type: "'left' | 'right' | 'maximize' | null"
        description: The zone the pointer is in, as the preview shows it; decides the drop.
      - id: this._resize
        type: Meta.Window | null
        description: A tile being resized by hand, for planner#_fit at the end of the grab.
      - id: this._plainTiles
        type: Map<Meta.Window, rect>
        description: On a secondary monitor, the geometry a window had before it was tiled there, given back when it is untiled — as GNOME's own tiling does.
    functions:
      - id: _onGrabBegin
        description: "Registers late a window that was never announced (windows#register): Chrome's detached tab windows on Wayland never send window-created, and without this could not be snapped. Unless a rule leaves it alone or it is Android's, which only android takes. A grab's flags are masked off before its kind is looked at: Chrome's tab dragged out of its window moves with WINDOW_FLAG_UNCONSTRAINED set (op 1025), and compared whole that grab was never taken for a move — the old code registered such a window late and then never snapped it (found by the chrome scenarios, 2026-10-18). A move grab starts a drag, followed at every move of the pointer, which the cursor tracker announces (position-invalidated, _follow) — not the stage, which sees no motion under a move grab, nor the window, which stops moving once pushed against the panel while the pointer goes on into the top zone (both measured in the test machine, 2026-10-19, where it replaced a poll every 33ms); a resize grab of a tile is remembered for _onGrabEnd. Whatever a grabbed window waited for from executor is dropped (executor#forgetPending): what the hand does to it is the user's, and the rect put back at its next size would undo it. A grab on a full Android window starts neither: resizing any Waydroid window resizes Android's whole display."
      - id: isDragging
        description: "Whether a window is being dragged right now, for windows: a dragged window's unmaximize and workspace change are the drag's, which dispatches what they mean."
      - id: _follow
        description: Follows the pointer across monitors. Past DRAG_THRESHOLD a tile, or a full window Mutter has just unmaximized, dispatches detached once (behaviour#drag-and-snap#detach, behaviour#going-home#drag-carries-home); near the left, right or top edge it shows the preview of that zone. There is no bottom zone.
      - id: _onGrabEnd
        description: Ends a drag by dispatching dropped with the zone it ended in, or nothing outside every zone (the window stays where it was put); ends a hand resize of a tile by dispatching resized with the width it was left at.
      - id: _showPreview
        description: Shows the preview of a zone on the work area of the pointer's monitor, in GNOME's own tile-preview style, so it follows the accent colour.
      - id: tileKeyboard
        description: "Super+Left/Right on the focused window: on the primary monitor, the side it is already tiled on dispatches untile, any other dispatches an explicit tile (behaviour#two-slots); on a secondary monitor it tiles or untiles in place (_plainTile). Does nothing to a full Android window."
      - id: _plainTile
        description: "GNOME's tiling, reproduced for a secondary monitor: fills the chosen half, or the whole work area for maximize, remembering the window's geometry first, and gives it back on the second press or when the window is dragged away. Moves nothing else."
      - id: _plainRestore
        description: Gives a window tiled on a secondary monitor its geometry back — on the second press, or only its size when a drag takes it away.
  - id: android
    type: "@Singleton"
    src: borshevik-workspace-manager@komorebinator/android.js
    description: Waydroid's windows (see the description for why they need a treatment of their own). Tells a full-screen Android app from a floating one by the layers drawn inside its window, registers the first as a full window like any other, leaves the second alone, and keeps a window's place when Waydroid replaces it. What it moves it moves through dispatch, like everything else.
    fields:
      - id: ANDROID_CLASS
        description: "The classes of Waydroid's windows: `Waydroid` for Android's full interface and `waydroid.<package>` for each app (isAndroid)."
      - id: ANDROID_REPLACE_MS
        default: 500
        description: "How long a closed Android window waits for its replacement (awaitReplacement), and a full-screen one that stopped filling its window waits before its release (_scheduleRelease) — the same wait, since both are Waydroid about to recreate a window: 500ms, against the 50–60ms Waydroid took between closing a window and opening the next on 2026-10-05, about 300ms at most when Android also changed the app's mode. A timer agreed with the author on purpose (see the guidelines on timers): Waydroid gives no link between a window it closes and the one it opens in its place, so only time tells a recreation from an app closed for good. Taking it away, or changing it, needs tests of its own first: Android's windows recreated on a theme change, on a switch between floating and full screen and on Settings opening in two panes, each landing where the window it replaces was, in the test machine's android group."
      - id: this._state
        type: Map<Meta.Window, androidState>
        description: "Every open Android window being watched, with its own state: `fullScreen` while its app fills it and it is registered as a full window — such a window keeps its workspace and size, and is never tiled from the keyboard or snapped at the end of a drag, since resizing any Waydroid window resizes Android's whole display; `handlers`, the signals followed on its actor tree; `pending`, a look queued for the next idle; `release`, the timer of a pending release; `inheritedOrigin`, where the window it replaced came from; `adopt`, set for a window taken at enable (adoptExisting). The entry is deleted as the window closes, and what must outlive it is kept apart (this._closed, this._goneOrigins). On disable each one's handlers are disconnected; a look already queued then finds the map gone and does nothing."
      - id: this._closed
        type: WeakSet<Meta.Window>
        description: "The Android windows that closed rather than moved, marked as they unmanage, for wasClosed: windows#_onWindowRemoved asks only at the next idle, after the window's entry in this._state is gone."
      - id: this._goneOrigins
        type: WeakMap<Meta.Window, workspace>
        description: Where a full-screen Android window came from, recorded as it closes — before windows#_onUnmanaged forgets the record the origin is read from — for awaitReplacement to hand to the window that replaces it.
      - id: this._followed
        type: WeakSet<Clutter.Actor>
        description: The actors already followed, so an actor Mutter re-adds to a window's tree is not followed twice.
      - id: this._gone
        type: Array<{cls, ws, origin, timer}>
        description: "Android windows closed less than ANDROID_REPLACE_MS ago and not yet replaced: the app's class, the workspace it was on, where it came from if it was full screen, and the timer that gives up on it. Its workspaces are objects, not indices. Each timer is removed when a replacement claims the entry, and all of them on disable."
    functions:
      - id: isAndroid
        description: Whether a window is Waydroid's, by its class (ANDROID_CLASS).
      - id: isFullScreen
        description: Whether an Android window is registered as full screen (this._state), for drag and the keyboard, which leave such a window's size alone.
      - id: wasClosed
        description: Whether an Android window was closed rather than moved — set as it unmanages, for windows#_onWindowRemoved, which decides only at the next idle.
      - id: _fillsWindow
        description: "Whether the app in an Android window fills it: true when the app's layers together cover the whole window, false when they cover less, null while there are none to look at yet. GNOME tells the two apart in no other way — Waydroid makes every window, floating or full screen, a maximized surface the size of Android's whole display, transparent and deaf to clicks outside the app, and draws the app on subsurfaces of it at the place Android put it; so the first surface in the window actor's tree is that background and the visible ones after it are the app. Surface actors are found by GType (MetaSurfaceActor), the class not being introspectable. Checked on GNOME 50 with Waydroid 1.6 on 2026-10-05: Settings floating had its layers at 713,181–1177,1005 of 1728×1048, full screen at 0,0–1728,1048 in two panes."
      - id: watch
        description: "Watches an Android window for as long as it is open: claims the place of a window it replaces first (claimPlace), looks at it at once (_check), then again whenever its app's layers change (_follow). Asking once at the first frame is not enough, for two reasons seen on 2026-10-05: Waydroid replaces the window when Android switches an app between floating and full screen, but the new window's first frames can still show the app at its old floating place (Play Store, maximized, showed 685,102–1277,888 three times running); and a floating app maximized inside Android may keep its window. Signals replaced a 250ms poll the same day, after counting them over two minutes of YouTube: 1751 in 126s, in bursts of up to 118 a second during animations and none at all in 91 of those seconds, against a poll that woke the shell 4 times a second all the time; signals arrive in frames GNOME draws anyway. When the window closes it records that it was closed, and where it came from if full screen — connected before windows#_onUnmanaged, which forgets the record that origin is read from. Called at the next idle after the first frame, never from it (see the guidelines)."
      - id: _follow
        description: "Follows an actor of an Android window's tree, and all below it: children added (followed in turn) and removed on every actor, and, on every surface actor, its allocation and visibility — a layer moving, resizing, or being hidden or shown, which Waydroid does without changing its size. Each brings a look at the window (_scheduleCheck). What an app draws inside a layer — video, a game, scrolling — emits none of these, so a full-screen game costs nothing while it runs."
      - id: _unfollow
        description: "Disconnects the signals followed on an Android window's tree and forgets its actors, so a later enable follows them again — on disable, for the windows still open. A window that closes only forgets its handlers: its actors are destroyed with it before its unmanaged signal, and disconnecting from them filled the journal with GJS's warnings about disposed objects, two per handler."
      - id: _scheduleCheck
        description: "Queues one look at an Android window for the next idle, however many signals arrive meanwhile — during an animation several layers each signal every frame. At idle rather than before the next frame, since a look can lead to a move, which must not happen while a frame is painted (see the guidelines). Not a delay worth the name: the look follows the frame that changed the layers."
      - id: _check
        description: "One look at a watched Android window (_fillsWindow), acting only on a change: a full-screen one whose app stops filling it is released ANDROID_REPLACE_MS later if it still does not fill it then (_scheduleRelease), and the release is called off if it fills it again meanwhile; any other whose app fills it is taken full screen (_takeFullScreen); a new one whose app's layers do not fill it, or are not there yet, is left alone (registry#ignore, rules applied) until they do — the layers can attach a moment after the first frame, and their arrival is itself a change that brings the next look, so nothing waits for them. A floating window that replaced a full-screen one (inheritedOrigin) goes back where that one came from (_return), at the first look that finds it floating — the same outcome as a release, for the case where Waydroid recreated the window instead of keeping it. A closed window is not looked at."
      - id: _takeFullScreen
        description: "Registers an Android window whose app fills it like any new window (windows#register), marked full screen: being maximized, it gets a workspace of its own through the ordinary placement (behaviour#full-alone), which also records where it came from."
      - id: _scheduleRelease
        description: "Releases a full-screen Android window whose app stopped filling it only if, ANDROID_REPLACE_MS later, it is still open, still full screen by the extension's record and still not filled; _cancelRelease calls it off when the app fills it again or the window closes, and on disable. Before Waydroid recreates a window — on a change of Android's theme or dark mode, say — Android draws a frame or two of a full-screen app not filling it; released at once, the window went to the workspace it came from, which was shown, and its full-screen replacement was then moved to a new workspace: the screen jumped away and back (seen in the test machine, 2026-10-05). Waiting the same time a closed window waits for its replacement lets the closing win, so the replacement takes the full-screen window's own workspace. The cost is that a real return to a floating app takes effect half a second later."
      - id: _cancelRelease
        description: Calls off a pending release (_scheduleRelease).
      - id: _release
        description: Stops managing an Android window whose app floats again inside the same window (registry#forget) and leaves it alone (registry#ignore), back on the workspace it came from (_origin, _return). The workspace it had to itself is left empty for GNOME to remove.
      - id: _origin
        description: "Where a full-screen Android window came from: what it inherited from the window it replaced (inheritedOrigin), else its own placement's record (its home) — a replacement's own home names the workspace it inherited, not where the app was before it went full screen."
      - id: _return
        description: Has a floating-again Android window put back on the workspace a full-screen window came from, if that still exists and is not where the window is, and shown there — the user has just acted on it — by dispatching returnTo. Forgets the inherited origin either way, so a floating window returns once.
      - id: awaitReplacement
        description: "The extension's one rule for Waydroid replacing windows: a closed Android window waits ANDROID_REPLACE_MS for a window of the same app, and the workspace it was on is not left meanwhile; if none comes, the app was closed for good and windows#_leaveIfEmpty runs then. Waydroid closes an Android window and opens a new one, always on the active workspace, whenever Android recreates the app's surface — switching it between floating and full screen, a change of Android's theme or dark mode (which theme-sync makes whenever GNOME's changes), Settings opening in two panes — and without this the new window landed wherever the user was, or on the workspace windows#_leaveIfEmpty had just gone to from the one the closed window emptied. One rule rather than a case per cause, so a recreation not yet seen behaves the same. The wait is the only delay in Android's handling, and only when an Android window closes; it was chosen on 2026-10-05 after the author had first refused any delay and after never leaving a workspace an Android window emptied had been tried and dropped."
      - id: claimPlace
        description: "Makes a new Android window the replacement of a closed one of the same app still awaited, if any — before it is looked at, so it is placed from where its predecessor was: it is put on that window's workspace (if that still exists and it opened elsewhere) by dispatching returnTo without showing it, inherits where that window came from if it was full screen, and the wait is cancelled. The ordinary rules then apply to it: full screen keeps or gets a workspace of its own, floating is left alone or, replacing a full-screen window, goes back where that one came from."
      - id: adoptExisting
        description: "At enable, takes the Android windows already open: one whose app fills it as full screen, registered and watched before its signals are connected so that, closing, it records its origin before the extension forgets it; a floating one is left alone; either is then watched — after it is placed, so the watch only follows its changes and moves nothing at enable."
  - id: rules
    type: "@Singleton"
    src: borshevik-workspace-manager@komorebinator/rules.js
    description: "The window rules (behaviour#window-rules): matching windows against them and applying their actions. The rules themselves are the window-rules setting, in the shape rules-ui writes (rules-ui#rule (JSON shape, not a class)), and are edited there."
    functions:
      - id: apply
        description: Applies every saved rule, in order, to one window — a later rule can override an earlier one's effect — and records on the window's record which ones matched. Deferred to the next idle after registration, like any change to a window.
      - id: applyToAll
        description: Applies a rule just saved in rules-ui to every open managed window and every window left alone, so editing a rule takes effect at once, not only for future windows. The ignore and close actions are the exception — see isIgnored and isClosed.
      - id: isIgnored
        description: "Whether an enabled ignore action of a rule the window matches says to leave it alone. Asked before a window is first taken under management — at its first frame, at enable, and when a grab starts on a window never announced — and nowhere else: a window already managed stays managed until it is reopened."
      - id: isClosed
        description: Whether an enabled close action of a rule the window matches says to close it as it opens (behaviour#window-rules#closed). Asked where isIgnored is, before it — at the first frame and at enable — and nowhere else, so a rule saved in rules-ui never closes a window already open.
      - id: ownWorkspaceRule
        description: The id of the rule whose open-on-own-workspace action a window matches, if any, for the snapshot (planner#Snapshot's ownWsRule); asked only while the window has not been placed yet.
      - id: _matches
        description: "Whether a window meets a rule: every enabled condition must hold — the class and title regexes (an invalid regex matches nothing), and for the boolean conditions only that the window currently has that property; their stored `value` is not consulted. The maximized condition reads Mutter's own flags, since rules are written against them."
      - id: _applyOne
        description: "Applies a matching rule's enabled actions that change the window directly: stick to or unstick from all workspaces, keep on top or not, a geometry given as percentages of the work area. Opening on a workspace of its own is a placement, which the planner decides (ownWorkspaceRule); the ignore and close actions decide whether a window is managed, or kept, at all, which only isIgnored and isClosed ask."
      - id: appliedTo
        description: The ids of the rules that matched a window, for rules-ui.
  - id: indicator
    type: "@View"
    src: borshevik-workspace-manager@komorebinator/indicator.js
    description: "The panel indicator that replaces the Activities button: the wall at a glance, one button per workspace with its windows' icons (behaviour#indicator). It shows and switches; it places nothing. Built as model and view: what it shows is read into plain data (indicator-model#readWall), what changed from the model shown is worked out (indicator-model#diff), and only that is applied to the buttons (indicator-view), which stay from one change to the next — a switch of workspace changes two buttons' state and builds nothing. Until 2026-10-20 every change destroyed the whole indicator and built it anew, icons and effects with it: 6 ms of the main thread at every switch of workspace in the test machine, some 70% of all the extension did for one, against half a millisecond since (measured with perf). Each kind of change has its method in the view, so an animation of one — a workspace's button appearing, going, moving — belongs to that method alone and touches nothing else. Reordering the workspaces by dragging a button is workspace-drag's."
    fields:
      - id: this._model
        type: Array<indicator-model#Entry>
        description: The model the buttons show now, the one the next reading is compared with (indicator-model#diff).
      - id: this._view
        type: indicator-view or null
        description: The buttons, and the logo before them; null once the panel is gone with the session ending (see _schedule).
      - id: this._drag
        type: workspace-drag or null
        description: "The drag under way, if any. While it is set the buttons are left as they are: the drag has measured them where they stood, and a button added or moved under it would land the drop elsewhere."
      - id: this._stale
        type: boolean
        description: An update was asked for during a drag, to be done as it ends.
      - id: this._wsHandles
        type: Array<[Meta.Workspace, handler id]>
        description: "The window-added and window-removed handlers on every workspace, so a window moving between workspaces updates the indicator even when nothing else changes. Those of a workspace GNOME removes are dropped at its workspace-removed (workspaces#dropRemovedWorkspaces): kept until disable they piled up, two for every workspace a maximized window had held (found by behaviour#quiet#nothing-left-behind, 2026-10-20)."
    functions:
      - id: enable
        description: "Hides the Activities button, puts the indicator first in the panel's left box, and follows what changes the wall as it is shown: workspaces added, removed, reordered or switched, windows arriving on and leaving each workspace (this._wsHandles, connected for each workspace as it is added), windows appearing or going (Shell.WindowTracker's tracked-windows-changed), the overview, for the logo's highlight, and the session mode, for the lock screen."
      - id: refresh
        description: "Called by dispatch after a plan has run: a window changing role — tiled, made full, floated — reorders its workspace's icons, and Mutter sends nothing the indicator follows for it."
      - id: _schedule
        description: "Batches updates to the next idle, one per burst of signals. During a drag it only marks the indicator stale (this._stale), and the drag's end updates it. Nothing is scheduled once the panel is gone: when the session ends GNOME destroys the panel before it disables the extension, and an update still pending then built into the destroyed box (`St.BoxLayout ... has been already disposed`, once in six session ends in the test machine, 2026-10-19); the box's destroy drops the view and the pending update."
      - id: _update
        description: "Reads the wall again (indicator-model#readWall), works out what changed from the model shown (indicator-model#diff), and has the view apply just that (indicator-view#apply); a reading that changed nothing touches no actor."
      - id: _onPress
        description: "A press on a workspace's button, from the view: with the first button and no drag under way it hands the press to a new workspace-drag, with the buttons as the view shows them; the click stays the button's until the press becomes a drag. A click switches to the button's workspace, and the logo toggles the overview, both the view's callbacks from here."
      - id: _onSessionModeUpdated
        description: "Hides the indicator while the screen is locked and shows it again on unlock, cancelling a drag under way. The extension stays enabled on the lock screen (metadata's session-modes), and the panel stays visible there: without this the icons of every open app, workspace by workspace, would be on show to anyone at the locked machine."
      - id: _dragEnded
        description: "workspace-drag's callback at its end: forgets the drag and updates if the indicator went stale meanwhile or the drag really started — the pressed button had its release taken by the drag (workspace-drag#_end), and a reorder the drag made comes as a signal the update applies as a move."
    components:
      - id: indicator-model
        type: "@Module"
        src: borshevik-workspace-manager@komorebinator/indicator-model.js
        description: "What the indicator shows, apart from how it is shown: plain data, and the changes from one reading of it to the next. It touches no actor, so the view is free to animate each change, and diff is tested on plain objects (tests#indicator-model)."
        fields:
          - id: Entry
            type: "{ws: Meta.Workspace, num: number, active: boolean, plus: boolean, icons: Array<{id: string, app: Shell.App}>}"
            description: "One button: the workspace, which also tells entries apart from one reading to the next — never its number, which a reorder changes; its number as shown; whether it is the active one; whether it is the '+' of the empty last workspace; and the icons of its windows in the order shown, each with an id of the window's own, so two windows of one app are two icons."
        functions:
          - id: readWall
            description: "The wall as the indicator shows it, one entry per button in order: the windows of each workspace that the extension counts (windows#isRelevant), not on every workspace and not skipping the pager, full ones first, then left, right and floating, by their record's role; empty workspaces left out but the active one and the last, which is the '+'. The one place it reads Mutter."
          - id: diff
            description: "What changed from one model to the next, in the order the view applies it: buttons removed, buttons added (with their index), buttons moved — as few as can be: those outside the longest run of buttons that kept their order among themselves, so a workspace dragged to the end moves alone rather than everything it passed — then each kept button's number, active state and icons (the '+' among them). Two equal models make no change."
      - id: indicator-view
        type: "@View"
        src: borshevik-workspace-manager@komorebinator/indicator-view.js
        description: "The indicator's actors, kept from one change to the next: the logo, built once, and one button per workspace, made when its workspace comes into the model and destroyed when it leaves; everything else is changed on the button that is there. Each kind of change is a method of its own — _add, _remove, _setNum, _setActive, _setIcons, and the order set in apply — which is where an animation of that change goes. Decides nothing: what to show is indicator-model's, what a click or a press does the indicator's. Counts in the performance report the buttons and icons it builds (perf#count), by which behaviour#indicator#switch-changes-state-only sees a switch build none."
        functions:
          - id: apply
            description: "Applies indicator-model#diff's changes one by one, then puts the buttons in the model's order after the logo, moving only those not already in their place."
          - id: buttons
            description: "The buttons in the order shown, for workspace-drag: each with its actor, its background, which a drag clones, its workspace, and whether it is the '+'."
          - id: _setActive
            description: "The active workspace's button opaque, with the active background, its icons in colour; any other at 80% and greyed. The grey is one Clutter.DesaturateEffect on the button's row, switched on and off, not one made anew for each icon of each button at every change: each effect draws its actor through a buffer of its own at every paint of the panel."
          - id: _setIcons
            description: "Puts the entry's icons in the row, or the '+': an app's icon is taken over from the button's own before one is made (create_icon_texture), so a window come or gone makes one icon, not the row's; the icons left over are destroyed."
          - id: setOverview
            description: The logo's highlight while the overview is open.
      - id: workspace-drag
        type: "@Module"
        src: borshevik-workspace-manager@komorebinator/workspace-drag.js
        description: "One drag of a workspace's button in the indicator, from the press to its end (behaviour#indicator): the gesture, the gap it opens, and the reorder it ends in. Made by the indicator for each press on a button, it follows the press's events (_onEvent) until the button is released or Escape is pressed, and then calls back, so the indicator rebuilds if it went stale meanwhile."
        fields:
          - id: DRAG_THRESHOLD_PX
            default: 6
            description: How far the pointer must move with the button held before a press is a drag rather than a click.
          - id: GAP_MS
            default: 150
            description: How long the buttons take to move apart for the gap, or back.
          - id: OUTLINE_PX
            default: 2
            description: The width of the outline around the dragged button, the border of stylesheet's .bwm-ws-dragged, by which the frame is set off so what it holds stays where the button was. Only what the button shows — its number and icons — is cloned to follow the pointer; the frame, a St.Bin carrying that class, gives it the button's shape with a background and outline of its own, the same whichever workspace is dragged. Cloning the button's background as well let the active workspace's, lighter still under the pointer, swallow the outline (seen by the author, 2026-10-19).
        functions:
          - id: _onEvent
            description: "The events of the press, until it ends. Until the drag starts they are the stage's captured events, seen before the buttons see them. A motion past DRAG_THRESHOLD_PX starts the drag: an actor of the drag's own, 0×0 in the UI group, takes the pointer and keyboard (Main.pushModal), as GNOME's own drags do, and from then on its plain events are listened to — a grab has no capture phase. Without the grab a release over a window went to that window's app and the drag never saw it end: it stayed open and swallowed the next press on the indicator (seen in the test machine, 2026-10-19; the old code had the same flaw). The dragged button's background is cloned to follow the pointer along the panel and the button itself is left as an empty space; every motion after that moves the clone and the gap (_insertionAt, _openGap). The release drops the workspace into the gap, or cancels if the pointer is away from the indicator; Escape cancels; a motion with the button up ends it too, its release having been missed. A press that never became a drag is left to the button's click."
          - id: _insertionAt
            description: "Where the workspace would go for a pointer at x: the number of the other buttons whose middle the dragged button's left edge has passed, the dragged button centred on the pointer and the others measured where they stand with it taken out of the row, so the gap moving does not move the answer. A button is passed, and the gap opens beyond it, once the dragged one covers more than half of it, as with tabs; measuring by the pointer instead put the gap one button too far when dragging right (seen in the test machine, 2026-10-19). Never after the '+', which stays last."
          - id: _openGap
            description: "Moves the other buttons, easing over GAP_MS, so a space the dragged button's width is open at the insertion point: each is shifted by the width of the dragged one if it is after the insertion point and the dragged one was not, or back by it if the dragged one was after it and it now is not."
          - id: _drop
            description: "Puts the dragged workspace where the gap is, with Mutter's reorder_workspace: before the workspace whose button follows the gap, or after the one before it when the gap is last — by the workspaces themselves, since the indicator leaves empty ones out and its buttons are not numbered like the workspaces. Nothing happens when the gap is where the button was. The '+' dropped this way switches to the empty workspace it put there. A workspace GNOME removed during the drag is not reordered."
          - id: _end
            description: "Ends the press either way, once, logging why: stops listening, lets the pointer go and destroys the actor that held it, lets the pressed button go without a click (fake_release) if a drag took its release, destroys the clone, puts the buttons back without easing, since the indicator's update follows and moves a reordered one into its place, and calls back the indicator with whether a drag happened."
          - id: cancel
            description: Ends the drag without dropping anything, for the indicator when it is disabled or the screen locks mid-drag (_end).
  - id: rules-ui
    type: "@View"
    src: borshevik-workspace-manager@komorebinator/window-rules-ui.js
    description: |
      An overlay inside GNOME Shell (not a separate window) for seeing and editing window rules, toggled by Super+R. The Windows tab lists the active workspace's windows with the rules that apply to each and a button to start a rule from that window; it follows window and workspace changes live, but not while a rule is being edited, which would throw the edit away. The Rules tab lists all rules and starts a blank one. A rule is edited in place as a draft: Save refuses a rule with no enabled condition, since it would match every window, stores it, and applies it at once to all open windows (rules#applyToAll); Cancel drops the draft; Delete removes a saved rule. A rule started from a window is prefilled with its class, and its geometry with where the window is now, so switching geometry on keeps it in place.
    fields:
      - id: "rule (JSON shape, not a class)"
        type: "{id: uuid, conditions: {class:{enabled,regex}, title:{enabled,regex}, onAllWorkspaces:{enabled,value}, above:{enabled,value}, skipTaskbar:{enabled,value}, fullscreen:{enabled,value}, maximized:{enabled,value}}, actions: {onAllWorkspaces:{enabled,value}, above:{enabled,value}, openOnNewWorkspace:{enabled,value}, ignore:{enabled,value}, close:{enabled,value}, geometry:{enabled,x,y,w,h}}}"
        description: "One element of the window-rules setting, as rules-ui writes it and rules#_matches and rules#_applyOne read it. Only `enabled` is edited for the boolean conditions and actions; their `value` stays at its default. geometry is in percentages of the work area. Rules saved before an action existed get it filled in, disabled, when opened in the editor."
  - id: preferences
    type: "@View"
    src: borshevik-workspace-manager@komorebinator/prefs.js
    description: "The page the GNOME Extensions app shows for this extension: whether landing on the last, empty workspace opens the overview; what happens when the last window on a workspace closes (go back, open the overview, or nothing); and, in a Debug group of their own below, what is there to find out what the extension does: two rows, each a switch with a Copy of its own, so it is plain which log is copied, and usable only while its switch is on. Debug logging's Copy takes the last DEBUG_LOG_MINUTES of the debug log from the journal (readDebugLog). The performance log's (perf-log) takes the performance report as text (perf#formatReport) through the extension's D-Bus object, since preferences run in a process of their own; switching it on starts a new report, so there is no Reset here (the D-Bus object's ResetPerf is the tests'). A toast says what was copied, or why nothing was: the journal unreadable, the debug log empty, the extension not running to answer."
    functions:
      - id: readDebugLog
        description: "The extension's own entries of the journal for the last DEBUG_LOG_MINUTES, read with `journalctl --user` — the user's own journal, which needs no group — since the shell has nothing of its log. An entry is taken whole, its indented lines with it: one of the debug log (`[BWM]`), an error whose stack trace names one of the extension's files, or one GNOME reports of the extension with an error in it, loading it say. GNOME's notes that name the extension in passing are left out (`... already installed ... will not be loaded`), and so are other extensions' errors (checked in the test machine, 2026-10-20)."
    fields:
      - id: DEBUG_LOG_MINUTES
        default: 10
        description: "How much of the debug log Copy takes: a bug just seen, small enough to go into a bug report (the author, 2026-10-20) — with debug logging on, the author's session wrote some 110 000 lines of it in a day. The row's subtitle names the minutes."
  - id: gschema
    type: "@ConfigFile"
    format: GSettings schema (XML)
    src: borshevik-workspace-manager@komorebinator/schemas/org.gnome.shell.extensions.borshevik-workspace-manager.gschema.xml
    description: "The extension's settings: the four the preferences page edits — perf-log, off by default, among them; the three keybindings (Super+Left, Super+Right, Super+R); the remembered float sizes per window class; and the window rules, which ship with three examples — Steam on a workspace of its own, picture-in-picture windows on top on every workspace in a corner, and the Collector app on top on every workspace — and two rules for windows Android makes of its own, not an app's. One leaves Android's on-screen keyboard alone (class `waydroid.InputMethod`): Waydroid gives it a window the size of Android's display like an app's, transparent but for the keyboard, whose layers at times cover all of it, so android#_fillsWindow took it for a full-screen app and moved it to a workspace of its own, taking the user there (2026-10-06). The other closes the launcher's Google Discover feed as it opens (class `^waydroid[.]GoogleDiscoverWindow`, behaviour#android-windows#discover-feed-closed): a window nobody can use, which held a workspace until closed by hand (2026-10-18). Each names that one window and no other of Android's own, so nothing useful is caught by a rule written for something else. Android's other windows need no rule: what the extension does to a window breaks them — Waydroid recreates a window whenever Android changes it, so each recreation reads as a new window to place; a maximized Android window covers the others inside Android's single display, where Android pauses them and Waydroid then closes their windows; and resizing any of them changes Android's display mode, on which Android's compositor has crashed — so the extension handles them itself (android#watch). Until 2026-10-05 a default rule left all of them alone, but that left a full-screen Android app on the current workspace among the user's own windows, so the rule was dropped for the extension's own handling, which can tell full screen from floating. A default rule reaches only those who have never saved rules of their own, since saving writes the whole list: adding the default rules a saved list lacks is left to the settings migration Borshevik is to have for every default it changes (komorebinator/borshevik#70)."
  - id: metadata
    type: "@ConfigFile"
    src: borshevik-workspace-manager@komorebinator/metadata.json
    description: "Extension manifest: GNOME Shell 49 and 50, linking the settings schema, and `session-modes` of user and unlock-dialog, so GNOME keeps the extension enabled while the screen is locked instead of disabling it on every lock and enabling it on every unlock — which rewrote Mutter's settings back and forth, rebuilt the indicator and took every window under management again each time (see the guidelines on state, and indicator#_onSessionModeUpdated for what that asks of the indicator)."
  - id: icon
    type: "@Graphic"
    format: SVG
    role: app-icon
    src: borshevik-workspace-manager@komorebinator/bwm_icon.svg
    description: The logo on the panel indicator's first button.
  - id: stylesheet
    type: "@ConfigFile"
    format: CSS (GNOME Shell St theming)
    src: borshevik-workspace-manager@komorebinator/stylesheet.css
    description: "Styles of the panel indicator and the rules overlay, loaded by GNOME Shell with the extension. Active and primary controls follow the user's accent colour; the snap preview reuses GNOME's own tile-preview style for the same reason."
  - id: translations
    type: "@ConfigFile"
    format: gettext (.pot template, .po per-locale, compiled .mo)
    src:
      - po/borshevik-workspace-manager@komorebinator.pot
      - po/ru.po
      - borshevik-workspace-manager@komorebinator/locale/ru/LC_MESSAGES/borshevik-workspace-manager@komorebinator.mo
    description: "The extension's strings — panel, rules overlay and preferences — with a Russian translation. The compiled .mo is what is loaded, and what the image ships (see @BorshevikWorkspaceManagerWorkflow)."
tests:
  - id: tried-by-the-author
    description: Manual. Tiling, workspace automation and the rules overlay can only be judged in a running shell, with real applications.
    command: "@BorshevikWorkspaceManagerExtension#recipes#run"
    expect: "the extension is ACTIVE in `gnome-extensions info`; no errors from it in the journal since login; the changed behaviour works, and tiling, maximizing onto a new workspace and returning from it still do"
  - id: planner-scenarios
    description: "The scenarios of `behaviour` that the planner decides, run against planner.js alone: each builds a planner#Snapshot from its `given`, hands planner#plan the intent its `when` describes, and checks the plan against its `then`. No GNOME Shell is needed, since the planner imports nothing from gi://; what depends on Mutter, the apps and Android — executor, the adapters — is left to vm-scenarios. Its `verifies` is every scenario tests/scenarios.js does not skip for the planner nor give a group, a behaviour named whole when none of its scenarios is left out; a scenario added to scenarios.js, or skipped there, changes it."
    command: gjs -m tests/planner/run.js
    expect: prints one line per scenario, each ok or SKIP with its reason, ends with `<n> ok, 0 failed, <m> skipped`, and exits 0
    verifies:
