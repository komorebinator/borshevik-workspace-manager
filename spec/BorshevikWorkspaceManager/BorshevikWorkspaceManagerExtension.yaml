description: |
  GNOME Shell extension entry point. Replaces GNOME's workspace behaviour with a tiling and
  workspace-automation window manager: each workspace and monitor has two tile slots, left and
  right; a window that is maximized, fullscreen, or does not fit gets a workspace of its own,
  created next to the one it came from; a window pushed out of its slot remembers where it came
  from and goes back when the slot frees up; floating windows buried under tiles are moved out
  of the way; and a panel indicator replaces the Activities button with one button per
  workspace, showing its windows' icons. Window rules — regex matches on class and title —
  can stick a window to all workspaces, keep it on top, give it a fixed geometry, or open it on
  a workspace of its own; they are edited in an in-shell overlay (rules-ui).

  While enabled it turns off Mutter's own edge tiling and takes over Super+Left/Super+Right,
  so the two cannot race; both are restored exactly as they were on disable. Automatic
  workspace creation happens on the primary monitor only; secondary monitors are tiled but
  never get workspaces created for them.

  State model: all per-window state lives on the Meta.Window object itself (the win._bwm*
  fields), never in Maps or index-keyed structures, so it survives workspace index shifts and
  enable/disable cycles. A window is managed exactly when win._bwmState is set (isTracked).
extends: "@Extension"
target: "@GnomeShell"
platform: GJS (GNOME Shell 49/50) — Clutter, GLib, Meta, Shell, St, Gio
src: borshevik-workspace-manager@komorebinator/extension.js
guidelines:
  - "Each window action is one function with explicit parameters. No flags, no shared state threaded between steps."
  - "Functions own their workspace logic: if a new workspace is needed they create it; if a free slot exists they take it. Callers say what they want, not how to do it."
  - "One code path per action — tiling from keyboard, on window open, and on return from displacement all go through the same _tileWindow()."
  - "State lives on the window (win._bwmState, win._bwmFloatRect, etc.), never in Maps or index-keyed structures."
  - "Layout is computed on demand by scanning live windows (_getLayout), never cached — always consistent by construction, no synchronization bugs possible."
  - "Set win._bwmState to the target state before calling any Mutter API that will change the window (maximize, unmaximize, a workspace change). The notify signals Mutter then fires are recognised as the extension's own and ignored by _onMaximizeChange's state comparison; set afterwards, they would be taken for a user action and acted on twice."
  - "Chrome async geometry: after unmaximize, Chrome restores its pre-maximize position after the extension applies tile geometry. Fixed by re-applying geometry once on the next size-changed signal (see _doTile)."
  - "Move serialization: simultaneous workspace creation/moves corrupt workspace indices. Fixed by _moveQueue + _moveInFlight serializing all _moveToNewWorkspace calls (see _finishMove)."
  - "notify::maximized double-fire: both notify::maximized-horizontally and notify::maximized-vertically fire for one user operation. Fixed by state-based dedup in _onMaximizeChange (compares the new 'full' boolean against the current _bwmState before acting)."
  - "Chrome tab-detach: detached tab windows on Wayland never fire the 'map'/window-created signal. Fixed by late-registering them in _onGrabBegin (grab-op-begin)."
  - "150ms batch window: Chrome session-restore opens many windows simultaneously. They are collected in _pendingBatch and processed together by _flushBatch so placement decisions see the final set, not one window at a time."
  - "Every signal handler and every state-mutating method calls LOG() near its entry and at each key transition, with an action-name prefix and the relevant context (window class, computed state, target side/workspace) — e.g. LOG('tileWindow:', win.get_wm_class(), ...). This is not spelled out per individual @Function description; preserve it as a pervasive instrumentation pattern across the whole class when regenerating, not just in the functions where it happens to be mentioned."
  - "A window is 'blocking' when it occupies both tile slots. The predicate used throughout is `win.fullscreen || win._bwmState === 'maximized'` — it reads the extension's own tracked state rather than Mutter's flags, so it agrees with whatever the extension last decided even while Mutter is mid-transition. Mutter's per-axis `maximized_horizontally`/`maximized_vertically` are read in exactly six functions, each one a place where the tracked state is not yet authoritative: _onMaximizeChange (deriving the new truth from the signal that announces it), _registerWindow and _handleNewWindow (a window can open already maximized, before _bwmState means anything), _doTile (hadState must know whether a real unmaximize call is needed before a move will take effect), _doMoveToNewWorkspace (same question after the window has landed elsewhere), and _matchesRule (rule conditions are written against Meta's own flags, so it mirrors them). `get_maximized() === Meta.MaximizeFlags.BOTH` appears once, in _adoptExistingWindows, for the same reason. A per-axis read anywhere else means the check is being written against Mutter instead of against the extension's state model, and the two will disagree during the async gaps this code spends most of its time in."
  - "Direction carries meaning: a workspace created for a window the user opened or maximized goes to the right of the current one and is shown; a workspace created for a window pushed out of its slot goes to the left and is not shown, and neither is one created for covered floaters. The view follows the window the user acted on, never one the extension moved out of the way."
fields:
  - id: SNAP_PX
    type: number
    default: 32
    description: How close to a work-area edge a dragged window must come to snap there — left, right, or the top edge to maximize.
  - id: DRAG_THRESHOLD
    type: number
    default: 20
    description: How far the pointer must travel from where a drag started before snap zones activate and a tiled window is detached, so a click on a title bar is not a drag.
  - id: ANDROID_WM_CLASS
    type: RegExp
    default: /^waydroid(\..+)?$/i
    description: The wm_class of Waydroid's windows — `Waydroid`, Android's full interface, and `waydroid.<package>`, one app — which _isRelevant leaves alone.
  - id: LOG
    type: "(...args) => void"
    description: A no-op, or a console.log wrapper prefixed '[BWM]' while the debug-logging setting is on; follows that setting live.
  - id: win._bwmState
    type: "'floating' | 'tiled-left' | 'tiled-right' | 'maximized' | undefined"
    description: Attached to every Meta.Window the extension manages. undefined means untracked (isTracked(win) checks this). The single source of truth for which of the four placement states a window is in.
  - id: win._bwmFloatRect
    type: "{x, y, width, height} | undefined"
    description: "Last known floating geometry. Only ever written from manual tile actions (_captureAndSaveFloatGeom) or when a window naturally settles while floating — never from auto-tile paths. The reason is that auto-tile paths (_restoreInitialState, _displaceTile, a window arriving on a workspace) see windows that are `floating` in state but tile-sized on screen: some applications, Mission Center among them, remember the geometry they were last tiled at and open at it. Capturing there would record tile dimensions as the user's float size — and, through the float-sizes setting, persist that for the whole wm_class. This happened once already, when a fix placed the capture inside _tileWindow, which both manual and automatic paths call; the capture is therefore the caller's job, done only by callers that know the action is manual."
  - id: win._bwmPreMax
    type: "string | undefined"
    description: The _bwmState value to restore to once the window is unmaximized.
  - id: win._bwmOrigin
    type: "{ws: MetaWorkspace, side?: string} | undefined"
    description: The workspace (and tile slot, if any) this window should attempt to return to once free — set when the window is displaced, maximized off its workspace, or moved to a dedicated workspace; consumed (deleted) by whichever function next acts on it.
  - id: win._bwmMoving
    type: boolean
    description: Set for the duration of an extension-initiated workspace change, so the resulting 'workspace-changed' is not taken for a user move, and a workspace the window leaves is not treated as emptied by the user.
  - id: win._bwmHandled
    type: boolean
    description: True once the window has passed through _handleNewWindow. Used by the 150ms batch window to distinguish "already placed" batch siblings from ones still pending placement, and by rules to apply openOnNewWorkspace only before placement.
  - id: win._bwmJustMoved
    type: boolean
    description: Set when the user manually moves a window to a new workspace; consumed once by the next covered-floater check (_checkCoveredFloaters) to skip relocating a window the user just placed there on purpose.
  - id: win._bwmAppliedRules
    type: "Set<uuid>"
    description: Ids of the window rules that matched this window; shown by rules-ui, and used by _moveToRuleWorkspace to gather windows of one rule on one workspace.
  - id: win._bwmTiledWs
    type: MetaWorkspace
    description: The workspace this window was tiled on, recorded by _tileWindow. Used in preference to get_workspace() at points (notably unmanaged) where the live accessor may already be unreliable.
  - id: win._bwmTiledMon
    type: number
    description: The monitor this window was tiled on, recorded by _tileWindow. Used in preference to get_monitor(), which returns -1 once a window starts unmanaging.
  - id: win._bwmForceNewWs
    type: "string | undefined"
    description: The id of a rule whose openOnNewWorkspace action matched a window not yet placed; _handleNewWindow then sends the window to _moveToRuleWorkspace instead of the normal placement.
  - id: this._moveQueue
    type: "Array<{win, tileOnArrive, direction}>"
    default: "[]"
    description: Workspace moves requested while another is in flight, run one at a time by _finishMove. Initialised in the constructor rather than in enable().
  - id: this._moveInFlight
    type: boolean
    default: false
    description: True while a workspace-creating move runs; see the move-serialization guideline.
  - id: this._pendingBatch
    type: "Set<Meta.Window> | null"
    description: Newly registered windows waiting for the 150ms batch window to close.
  - id: this._currentBatch
    type: "Set<Meta.Window> | null"
    description: The batch being placed right now; lets _handleNewWindow tell not-yet-placed siblings from windows that were already there.
  - id: this._drag
    type: "{win, monitor, startX, startY, tiledSide, originReturned?} | null"
    description: The move-drag in progress. Set before anything else when a drag starts, because Mutter unmaximizes a dragged window at once and _onUnmaximized must already know it is a drag.
  - id: this._snapSide
    type: "'left' | 'right' | 'maximize' | null"
    description: The snap zone the current drag is in, as the preview shows it; decides the drop outcome.
  - id: this._resize
    type: "{win, partner} | null"
    description: A resize of a tile whose opposite slot is also tiled; the partner is resized to match when it ends.
  - id: this._savedEdgeTiling
    type: boolean
    description: Mutter's edge-tiling setting as it was before enable() switched it off; restored on disable.
  - id: this._savedTileLeft
    type: string[]
    description: GNOME's own tile-left binding, cleared while the extension owns Super+Left and restored on disable; this._savedTileRight is its right-hand twin.
functions:
  - id: _adoptExistingWindows
    description: "At enable, takes every relevant window that is already open under management in place, without moving it: maximized ones as maximized (to be restored as floating, since their real prior state is unknown), the rest as floating at their current geometry. Needed because after a shell restart some windows — Chrome web apps among them — come back without the signals new windows send, and would otherwise stay untracked, so a new window opening beside them would take their workspace for empty."
  - id: _isRelevant
    description: "Whether the extension manages a window at all: normal windows only, not hidden from the taskbar, not on all workspaces, and not Android's. Dialogs, docks and sticky windows are left alone everywhere — tiling, the indicator and rules-ui. Android's windows are Waydroid's — `Waydroid` for its full interface and `waydroid.<package>` for each app, by wm_class — and are left alone because what the extension does to a window breaks them: Android sizes its own windows and Waydroid recreates a window when Android does, so each recreation reads as a new window to place, moving it to a workspace of its own and maximizing it; a maximized Android window covers the others inside Android's single display, where Android pauses them and Waydroid then closes their windows; and resizing Android's windows changes Android's display mode, on which Android's compositor has crashed. GNOME's own placement leaves them where Waydroid puts them."
  - id: _defer
    description: Runs a function once, at the compositor's next idle. Used wherever the extension must let Mutter finish the current operation — an unmaximize, a workspace change — before reading back state or acting on it; read synchronously inside a signal handler, that state is often stale.
  - id: _captureAndSaveFloatGeom
    description: "Remembers a floating window's current geometry on the window, and its size as a fraction of the work area for its whole wm_class in the float-sizes setting, so the next window of that app floats at the size the user chose. Called only from manual tile actions (_tileKeyboard, _finalizeDrag) — see win._bwmFloatRect."
  - id: _getLayout
    description: "The two tile slots of a workspace on a monitor, computed from the live windows every time: each slot holds the window tiled there, or the blocking window (see guidelines), which fills both. Never cached, so it cannot drift from reality."
  - id: _onWindowCreated
    description: "Starts managing a new relevant window once its first frame is drawn, so its real initial geometry is known — unless the grab-op path registered it meanwhile. Relevance is asked again at the first frame: a Wayland client names its app id after its window is created, so at creation wm_class is still empty and _isRelevant cannot yet tell an Android window from any other (Waydroid's windows were registered this way)."
  - id: _registerWindow
    description: "Takes a new window under management as floating, applies the window rules (deferred), seeds its float geometry — from the float-sizes setting for its class, centred on the work area, else from its current geometry unless it opened maximized — follows its unmanage, workspace, maximize and fullscreen changes, and queues it in the 150ms batch."
  - id: _flushBatch
    description: Places the windows of a closed batch together (_handleNewWindow), skipping any closed meanwhile.
  - id: _handleNewWindow
    description: |
      Places a newly opened window. A window a rule sent to its own workspace goes to _moveToRuleWorkspace (primary monitor only) and nothing else applies. A blocking window on the primary monitor gets a new workspace to the right whenever its workspace already holds another managed window or a tile; batch siblings not yet placed do not count as already there, so windows opening together do not push each other out. Everything else goes to _restoreInitialState.
  - id: _restoreInitialState
    description: |
      The size-based placement of a new window. One that already fills more than 90% of the work area both ways is maximized (and so may get its own workspace). One that is full-height and between 20% and 80% of the width is tiled, on the half its centre is on if that slot is free, else the other; alone on the workspace it keeps its width (capped at 80%), next to a partner it fills the rest. With both slots taken it gets a new workspace, preferring an existing one to the right with a free slot. Anything else stays floating where it opened.
  - id: _onUnmanaged
    description: "When a window closes, drops all its extension state and, if it held a tile slot, lets a window displaced from exactly that slot come back (_tryReturnOrigin). Reads the slot from win._bwmTiledWs/_bwmTiledMon, since the live accessors are unreliable by then."
  - id: _leaveIfEmpty
    description: "When the active workspace loses its last window — for any reason but the extension's own moves — follows the on-empty-workspace setting: go to the workspace on the left (or the one on the right if this was the leftmost, but only if that one has windows), open the overview, or do nothing."
  - id: _onActiveWorkspaceChanged
    description: With overview-on-last-workspace on, arriving on the last workspace while it is empty opens the overview.
  - id: _onWorkspaceChanged
    description: |
      A window changed workspace. Moves the extension made itself (win._bwmMoving) and index shifts from other workspaces appearing or disappearing change nothing. A move by the user raises the window, cancels any pending return to an origin (the user chose a new home), frees the slot it left for any displaced window waiting on it, and places it on the new workspace with _tileIntoFreeSlot.
  - id: _tileIntoFreeSlot
    description: "Places a window the user moved to another workspace. A tiled window keeps its side when both slots are free there; any window — floating ones too — takes the free slot when exactly one is taken; with both taken it floats. A floating window on a workspace with no tiles stays floating."
  - id: _onMaximizeChange
    description: |
      Follows maximize and fullscreen changes, ignoring those that only confirm the tracked state (see guidelines). On maximize it remembers the state to restore and, if the window shares its workspace on the primary monitor, moves it to a workspace of its own, remembering where it came from. On unmaximize it hands over to _onUnmaximized.
  - id: _onUnmaximized
    description: |
      Restores a window after unmaximize. During a drag it just floats — Mutter unmaximizes on drag start and the drop decides. A window that was given its own workspace goes back where it came from: into its old slot if that is free and its old workspace shows nothing fullscreen, or floating onto its old workspace if it was floating. Otherwise it returns to its previous tile slot on the current workspace if that is free, and floats if not.
  - id: _onGrabBegin
    description: |
      Registers late a window that was never announced (see the Chrome tab-detach guideline). A move grab starts a drag, polled every 33ms by _pollDrag; a tiled window is detached only once the drag passes DRAG_THRESHOLD, not on the click. A resize grab of a tile whose partner is also tiled is remembered for a linked resize.
  - id: _onGrabEnd
    description: Ends a drag (_finalizeDrag) or a linked resize (_finalizeResize).
  - id: _pollDrag
    description: |
      Follows a drag across monitors. Past DRAG_THRESHOLD a tiled window is detached — floating again, at its class's remembered size if there is one — its slot is offered back to a displaced window, and a floater with a pending origin is sent home (_floatReturnToOrigin). Near the left or right edge, or the top edge, it shows the snap preview for that side or for maximize; there is no bottom-edge snap.
  - id: _finalizeDrag
    description: "At the drop: in no snap zone the window stays where the user put it; at the top edge it is maximized; at a side it is tiled there, and the float size it had is remembered as a manual choice."
  - id: _finalizeResize
    description: "After a tile is resized by hand, resizes its partner to exactly fill the rest of the work area, unless that would leave the partner under 50px wide."
  - id: _tileWindow
    description: |
      Tiles a window to a side. When the side is free it takes it, filling whatever width its partner leaves. When it is taken and the other side is free, the occupant moves over, keeping its width. When both are taken the occupant is displaced to another workspace (_displaceTile) — unless the occupant is blocking, in which case the window itself moves to a new workspace instead. Records where it was tiled (win._bwmTiledWs/_bwmTiledMon).
  - id: _doTile
    description: |
      Applies tile geometry only — no state or layout changes. Moves, then resizes, since some apps ignore the move part of a combined call. A window coming out of maximize or fullscreen is unmaximized first, with Mutter told it is an unmaximize so it animates as one, and its geometry is applied once more on its next size change (see the Chrome async geometry guideline), with a 2-second safety net so that handler never leaks. Geometry is applied only while the window is still tiled, since its state may have changed in the meantime.
  - id: _doMaximize
    description: "Maximizes a window on the extension's own initiative (drag to the top edge, a new near-full-screen window), remembering its float geometry and the state to restore, and giving it a workspace of its own exactly as a user maximize would. Does nothing to a window already maximized, which would overwrite the state to restore."
  - id: _doFloat
    description: "Floats a window at its remembered geometry, else at its class's remembered size centred on the work area. A window with neither — one that opened maximized — is centred at whatever size it settles at after unmaximizing, rather than at an arbitrary default."
  - id: _tileKeyboard
    description: "Super+Left/Right on the focused window: pressing the side it is already tiled on floats it again, offers its slot back to a displaced window and sends it home if it has an origin; any other state tiles it to that side, remembering its float size as a manual choice."
  - id: _onRestacked
    description: "After stacking changes — debounced to 80ms, since the signal fires constantly — checks every workspace and monitor that has both covering windows (tiled, maximized or fullscreen) and floating ones for floaters buried under them."
  - id: _checkCoveredFloaters
    description: |
      Moves floating windows that are completely hidden behind covering windows out of the way, in the background. Always-on-top windows, sticky ones, a window the user just moved there, one the extension is moving, and dialogs of a managed parent are left alone. A buried floater is moved into free space on the same workspace if it fits, else into free space on the workspace to the left, else together with the other buried floaters onto one new workspace to the left, without switching to it.
  - id: _isFullyCovered
    description: "Whether a floater is hidden: fully off-screen, or its visible width entirely covered by covering windows stacked above it that overlap it vertically. A one-dimensional sweep is enough because covering windows here are always full height."
  - id: _getFreeArea
    description: "The part of a workspace a floater can be moved into: nothing when a window there is blocking or both slots are taken; otherwise the area beside the one tile, or the whole work area."
  - id: _tryRelocateOnSameWs
    description: Centres a floater in the free area of its own workspace, if it fits and the area is at least 50px wide; position only, no resize.
  - id: _tryRelocateOnPrevWs
    description: "Moves a floater into the free area of the workspace to the left, if it fits there, without switching to it. A workspace to the left with no windows on the monitor is skipped rather than guessed at, since its work area cannot be read."
  - id: _floatReturnToOrigin
    description: "Sends a floating window back to the workspace it was moved from, and shows that workspace, once it is alone where it is now — not while it shares the workspace, which would disturb what the user is doing, and not onto a workspace showing something fullscreen. Its origin is consumed either way."
  - id: _tryReturnOrigin
    description: |
      When a tile slot frees up, brings back a window displaced from exactly that slot — unless that window now has a partner of its own that was not displaced, which would be torn apart. The returning window's own former partner, if it was displaced from the same workspace too, is then brought back into the other slot, so a pair returns together. Never throws: it runs from many deferred call sites, and an exception there would be lost.
  - id: _displaceTile
    description: |
      Pushes a tile out of its slot to make room, remembering where it came from. It lands on a workspace to the left that has a free slot and holds only tiles displaced from the same workspace — never onto one with tiles the user placed — or else on a new workspace to the left, which is not shown.
  - id: _moveBatchToNewWorkspace
    description: Moves several windows onto one new workspace to the left of the current one, without switching to it, so covered floaters leave together instead of each taking a workspace.
  - id: _moveToRuleWorkspace
    description: "Gathers the windows of an openOnNewWorkspace rule on one workspace: onto the workspace another window of the same rule is on; or it stays where it is if nothing else managed is there; or onto a new workspace."
  - id: _moveToNewWorkspace
    description: Requests a move to a new workspace, running it now or queuing it behind the one in flight (see the move-serialization guideline).
  - id: _doMoveToNewWorkspace
    description: |
      Moves a window to a workspace of its own. A window that is to be tiled on arrival first tries the current workspace and the next one for a free slot, and only creates a workspace if neither has one. A new workspace goes to the right and is shown — unless something fullscreen is on the monitor it leaves, which is not pulled out of view — or, for a displaced window, to the left and not shown. On arrival the window is tiled as asked, left maximized if it arrived maximized, or placed by _restoreInitialState. Sticky windows are not moved at all.
  - id: _finishMove
    description: Marks the move done and starts the next queued one, skipping queued windows that were closed meanwhile.
  - id: _updateIndicator
    description: |
      Rebuilds the panel indicator, batched to the next idle whenever workspaces or windows change. First a logo button that toggles the overview and is highlighted while the overview is open; then one button per workspace, numbered, with the icons of its windows (fullscreen and maximized first, then left, right, floating; greyed out on inactive workspaces). Empty workspaces are left out, except the active one and the last, which shows a '+' instead of icons. Clicking a button switches to it; dragging one onto another reorders the workspaces; dragging the '+' onto a workspace puts the empty workspace in that place and switches to it; Escape cancels a drag.
  - id: _applyWindowRules
    description: Applies every saved rule, in order, to a newly registered window; a later rule can override an earlier one's effect.
  - id: _applyRuleToAll
    description: Applies a rule just saved in rules-ui to every open managed window, so editing a rule takes effect at once, not only for future windows.
  - id: _matchesRule
    description: "Whether a window meets a rule: every enabled condition must hold — the class and title regexes (an invalid regex matches nothing), and for the boolean conditions only that the window currently has that property; their stored `value` is not consulted."
  - id: _applyRule
    description: "Applies a matching rule's enabled actions: stick to or unstick from all workspaces, keep on top or not, a geometry given as percentages of the work area, and — only for a window not yet placed — opening on a workspace of its own. Records the rule on the window either way."
components:
  - id: rules-ui
    type: "@View"
    src: borshevik-workspace-manager@komorebinator/window-rules-ui.js
    description: |
      An overlay inside GNOME Shell (not a separate window) for seeing and editing window rules, toggled by Super+R. The Windows tab lists the active workspace's windows with the rules that apply to each and a button to start a rule from that window; it follows window and workspace changes live, but not while a rule is being edited, which would throw the edit away. The Rules tab lists all rules and starts a blank one. A rule is edited in place as a draft: Save refuses a rule with no enabled condition, since it would match every window, stores it, and applies it at once to all open windows (_applyRuleToAll); Cancel drops the draft; Delete removes a saved rule. A rule started from a window is prefilled with its class, and its geometry with where the window is now, so switching geometry on keeps it in place.
    fields:
      - id: "rule (JSON shape, not a class)"
        type: "{id: uuid, conditions: {class:{enabled,regex}, title:{enabled,regex}, onAllWorkspaces:{enabled,value}, above:{enabled,value}, skipTaskbar:{enabled,value}, fullscreen:{enabled,value}, maximized:{enabled,value}}, actions: {onAllWorkspaces:{enabled,value}, above:{enabled,value}, openOnNewWorkspace:{enabled,value}, geometry:{enabled,x,y,w,h}}}"
        description: "One element of the window-rules setting, as rules-ui writes it and _matchesRule/_applyRule read it. Only `enabled` is edited for the boolean conditions and actions; their `value` stays at its default. geometry is in percentages of the work area. Rules saved before an action existed get it filled in, disabled, when opened in the editor."
  - id: preferences
    type: "@View"
    src: borshevik-workspace-manager@komorebinator/prefs.js
    description: "The page the GNOME Extensions app shows for this extension: whether landing on the last, empty workspace opens the overview; what happens when the last window on a workspace closes (go back, open the overview, or nothing); and debug logging."
  - id: gschema
    type: "@ConfigFile"
    format: GSettings schema (XML)
    src: borshevik-workspace-manager@komorebinator/schemas/org.gnome.shell.extensions.borshevik-workspace-manager.gschema.xml
    description: "The extension's settings: the three the preferences page edits; the three keybindings (Super+Left, Super+Right, Super+R); the remembered float sizes per window class; and the window rules, which ship with three examples — Steam on a workspace of its own, picture-in-picture windows on top on every workspace in a corner, and the Collector app on top on every workspace."
  - id: metadata
    type: "@ConfigFile"
    src: borshevik-workspace-manager@komorebinator/metadata.json
    description: "Extension manifest: GNOME Shell 49 and 50, linking the settings schema."
  - id: icon
    type: "@Graphic"
    format: SVG
    role: app-icon
    src: borshevik-workspace-manager@komorebinator/bwm_icon.svg
    description: The logo on the panel indicator's first button.
  - id: stylesheet
    type: "@ConfigFile"
    format: CSS (GNOME Shell St theming)
    src: borshevik-workspace-manager@komorebinator/stylesheet.css
    description: "Styles of the panel indicator and the rules overlay, loaded by GNOME Shell with the extension. Active and primary controls follow the user's accent colour; the snap preview reuses GNOME's own tile-preview style for the same reason."
  - id: translations
    type: "@ConfigFile"
    format: gettext (.pot template, .po per-locale, compiled .mo)
    src:
      - po/borshevik-workspace-manager@komorebinator.pot
      - po/ru.po
      - borshevik-workspace-manager@komorebinator/locale/ru/LC_MESSAGES/borshevik-workspace-manager@komorebinator.mo
    description: "The extension's strings — panel, rules overlay and preferences — with a Russian translation. The compiled .mo is what is loaded, and what the image ships (see @BorshevikWorkspaceManagerWorkflow)."
tests:
  - id: tried-by-the-author
    description: Manual. Tiling, workspace automation and the rules overlay can only be judged in a running shell, with real applications.
    command: "@BorshevikWorkspaceManagerExtension#recipes#run"
    expect: "the extension is ACTIVE in `gnome-extensions info`; no errors from it in the journal since login; the changed behaviour works, and tiling, maximizing onto a new workspace and returning from it still do"
recipes:
  - id: run
    description: "Makes the next GNOME Shell session on this machine run the extension straight from the working tree, so a change can be tried before it is committed. The extension is installed per user as a symlink into the repository; a copy under the same UUID in ~/.local/share takes precedence over the one the Borshevik image installs in /usr/share/gnome-shell/extensions, so the session runs the working tree, not the image's copy of `main`."
    instructions:
      - "Check ~/.local/share/gnome-shell/extensions/borshevik-workspace-manager@komorebinator. If it is missing, create it as a symlink to this repository's borshevik-workspace-manager@komorebinator/ directory. If it is a real directory, or a symlink pointing anywhere else, stop and ask — it is an installation someone made on purpose."
      - "Compile the schemas in place with `glib-compile-schemas borshevik-workspace-manager@komorebinator/schemas`; the output is ignored by git, and the image compiles its own at build time."
      - "If po/ru.po is newer than the compiled .mo under locale/ru/LC_MESSAGES, regenerate it with `msgfmt -o <that .mo> po/ru.po`. Unlike the schemas, the .mo is committed and is what the image ships, so it becomes part of the change."
      - "Check `gnome-extensions info borshevik-workspace-manager@komorebinator` and enable it with `gnome-extensions enable` if it is not enabled."
      - "GNOME Shell on Wayland cannot reload an extension or restart in place: ask the author to log out and back in. Never do it for them — it ends every program in the session, this one included."
      - "Once they are back, look for errors the extension threw since login in `journalctl -b /usr/bin/gnome-shell`, and report them before the author starts testing."
